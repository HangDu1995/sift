<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评测回顾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #faf9f5;
      --surface: #ffffff;
      --border: #e8e6dc;
      --text: #141413;
      --text-muted: #b0aea5;
      --accent: #d97757;
      --accent-hover: #c4613f;
      --green: #788c5d;
      --green-bg: #eef2e8;
      --red: #c44;
      --red-bg: #fceaea;
      --header-bg: #141413;
      --header-text: #faf9f5;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---- Header ---- */
    .header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .header .instructions {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 0.25rem;
    }
    .header .progress {
      font-size: 0.875rem;
      opacity: 0.8;
      text-align: right;
    }

    /* ---- Main content ---- */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* ---- Sections ---- */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex-shrink: 0;
    }
    .section-header {
      font-family: 'Poppins', sans-serif;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .section-body {
      padding: 1rem;
    }

    /* ---- Config badge ---- */
    .config-badge {
      display: inline-block;
      padding: 0.2rem 0.625rem;
      border-radius: 9999px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-left: 0.75rem;
      vertical-align: middle;
    }
    .config-badge.config-primary {
      background: rgba(33, 150, 243, 0.12);
      color: #1976d2;
    }
    .config-badge.config-baseline {
      background: rgba(255, 193, 7, 0.15);
      color: #f57f17;
    }

    /* ---- Prompt ---- */
    .prompt-text {
      white-space: pre-wrap;
      font-size: 0.9375rem;
      line-height: 1.6;
    }

    /* ---- Outputs ---- */
    .output-file {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .output-file + .output-file {
      margin-top: 1rem;
    }
    .output-file-header {
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .output-file-header .dl-btn {
      font-size: 0.7rem;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 500;
      opacity: 0.8;
    }
    .output-file-header .dl-btn:hover {
      opacity: 1;
      text-decoration: underline;
    }
    .output-file-content {
      padding: 0.75rem;
      overflow-x: auto;
    }
    .output-file-content pre {
      font-size: 0.8125rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .output-file-content img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .output-file-content iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
    .output-file-content table {
      border-collapse: collapse;
      font-size: 0.8125rem;
      width: 100%;
    }
    .output-file-content table td,
    .output-file-content table th {
      border: 1px solid var(--border);
      padding: 0.375rem 0.5rem;
      text-align: left;
    }
    .output-file-content table th {
      background: var(--bg);
      font-weight: 600;
    }
    .output-file-content .download-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .output-file-content .download-link:hover {
      background: var(--border);
    }
    .empty-state {
      color: var(--text-muted);
      font-style: italic;
      padding: 2rem;
      text-align: center;
    }

    /* ---- Feedback ---- */
    .prev-feedback {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.625rem 0.75rem;
      margin-top: 0.75rem;
      font-size: 0.8125rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .prev-feedback-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.25rem;
      color: var(--text-muted);
    }
    .feedback-textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9375rem;
      line-height: 1.5;
      resize: vertical;
      color: var(--text);
    }
    .feedback-textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .feedback-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      min-height: 1.1em;
    }

    /* ---- Grades (collapsible) ---- */
    .grades-toggle {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .grades-toggle:hover {
      color: var(--accent);
    }
    .grades-toggle .arrow {
      margin-right: 0.5rem;
      transition: transform 0.15s;
      font-size: 0.75rem;
    }
    .grades-toggle .arrow.open {
      transform: rotate(90deg);
    }
    .grades-content {
      display: none;
      margin-top: 0.75rem;
    }
    .grades-content.open {
      display: block;
    }
    .grades-summary {
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .grade-badge {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .grade-pass { background: var(--green-bg); color: var(--green); }
    .grade-fail { background: var(--red-bg); color: var(--red); }
    .assertion-list {
      list-style: none;
    }
    .assertion-item {
      padding: 0.625rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.8125rem;
    }
    .assertion-item:last-child { border-bottom: none; }
    .assertion-status {
      font-weight: 600;
      margin-right: 0.5rem;
    }
    .assertion-status.pass { color: var(--green); }
    .assertion-status.fail { color: var(--red); }
    .assertion-evidence {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 0.25rem;
      padding-left: 1.5rem;
    }

    /* ---- View tabs ---- */
    .view-tabs {
      display: flex;
      gap: 0;
      padding: 0 2rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .view-tab {
      font-family: 'Poppins', sans-serif;
      padding: 0.625rem 1.25rem;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .view-tab:hover { color: var(--text); }
    .view-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .view-panel { display: none; }
    .view-panel.active { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

    /* ---- Benchmark view ---- */
    .benchmark-view {
      padding: 1.5rem 2rem;
      overflow-y: auto;
      flex: 1;
    }
    .benchmark-table {
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.8125rem;
      width: 100%;
      margin-bottom: 1.5rem;
    }
    .benchmark-table th, .benchmark-table td {
      padding: 0.625rem 0.75rem;
      text-align: left;
      border: 1px solid var(--border);
    }
    .benchmark-table th {
      font-family: 'Poppins', sans-serif;
      background: var(--header-bg);
      color: var(--header-text);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .benchmark-table tr:hover { background: var(--bg); }
    .benchmark-table tr.benchmark-row-with { background: rgba(33, 150, 243, 0.06); }
    .benchmark-table tr.benchmark-row-without { background: rgba(255, 193, 7, 0.06); }
    .benchmark-table tr.benchmark-row-with:hover { background: rgba(33, 150, 243, 0.12); }
    .benchmark-table tr.benchmark-row-without:hover { background: rgba(255, 193, 7, 0.12); }
    .benchmark-table tr.benchmark-row-avg { font-weight: 600; border-top: 2px solid var(--border); }
    .benchmark-table tr.benchmark-row-avg.benchmark-row-with { background: rgba(33, 150, 243, 0.12); }
    .benchmark-table tr.benchmark-row-avg.benchmark-row-without { background: rgba(255, 193, 7, 0.12); }
    .benchmark-delta-positive { color: var(--green); font-weight: 600; }
    .benchmark-delta-negative { color: var(--red); font-weight: 600; }
    .benchmark-notes {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .benchmark-notes h3 {
      font-family: 'Poppins', sans-serif;
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
    }
    .benchmark-notes ul {
      list-style: disc;
      padding-left: 1.25rem;
    }
    .benchmark-notes li {
      font-size: 0.8125rem;
      line-height: 1.6;
      margin-bottom: 0.375rem;
    }
    .benchmark-empty {
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      padding: 3rem;
    }

    /* ---- Navigation ---- */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .nav-btn {
      font-family: 'Poppins', sans-serif;
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--bg);
      border-color: var(--text-muted);
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .done-btn {
      font-family: 'Poppins', sans-serif;
      padding: 0.5rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    .done-btn:hover {
      background: var(--bg);
      border-color: var(--text-muted);
    }
    .done-btn.ready {
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
    }
    .done-btn.ready:hover {
      background: var(--accent-hover);
    }
    /* ---- Done overlay ---- */
    .done-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .done-overlay.visible {
      display: flex;
    }
    .done-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 2rem 3rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
    }
    .done-card h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .done-card p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .done-card .btn-row {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }
    .done-card button {
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      font-size: 0.875rem;
    }
    .done-card button:hover {
      background: var(--bg);
    }
    /* ---- Toast ---- */
    .toast {
      position: fixed;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--header-bg);
      color: var(--header-text);
      padding: 0.625rem 1.25rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 200;
    }
    .toast.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="app" style="height:100vh; display:flex; flex-direction:column;">
    <div class="header">
      <div>
        <h1>评测回顾：<span id="skill-name"></span></h1>
        <div class="instructions">查看每条输出并在下方留下反馈。使用方向键或按钮导航。完成后，复制反馈并粘贴到 Claude Code。</div>
      </div>
      <div class="progress" id="progress"></div>
    </div>

    <!-- View tabs (only shown when benchmark data exists) -->
    <div class="view-tabs" id="view-tabs" style="display:none;">
      <button class="view-tab active" onclick="switchView('outputs')">输出</button>
      <button class="view-tab" onclick="switchView('benchmark')">基准测试</button>
    </div>

    <!-- Outputs panel (qualitative review) -->
    <div class="view-panel active" id="panel-outputs">
    <div class="main">
      <!-- Prompt -->
      <div class="section">
        <div class="section-header">提示词 <span class="config-badge" id="config-badge" style="display:none;"></span></div>
        <div class="section-body">
          <div class="prompt-text" id="prompt-text"></div>
        </div>
      </div>

      <!-- Outputs -->
      <div class="section">
        <div class="section-header">输出</div>
        <div class="section-body" id="outputs-body">
          <div class="empty-state">未找到输出文件</div>
        </div>
      </div>

      <!-- Previous Output (collapsible) -->
      <div class="section" id="prev-outputs-section" style="display:none;">
        <div class="section-header">
          <div class="grades-toggle" onclick="togglePrevOutputs()">
            <span class="arrow" id="prev-outputs-arrow">&#9654;</span>
            上次输出
          </div>
        </div>
        <div class="grades-content" id="prev-outputs-content"></div>
      </div>

      <!-- Grades (collapsible) -->
      <div class="section" id="grades-section" style="display:none;">
        <div class="section-header">
          <div class="grades-toggle" onclick="toggleGrades()">
            <span class="arrow" id="grades-arrow">&#9654;</span>
            评分详情
          </div>
        </div>
        <div class="grades-content" id="grades-content"></div>
      </div>

      <!-- Feedback -->
      <div class="section">
        <div class="section-header">你的反馈</div>
        <div class="section-body">
          <textarea
            class="feedback-textarea"
            id="feedback"
            placeholder="你对这个输出有什么看法？有什么问题、建议或做得好的地方？"
          ></textarea>
          <div class="feedback-status" id="feedback-status"></div>
          <div class="prev-feedback" id="prev-feedback" style="display:none;">
            <div class="prev-feedback-label">上次反馈</div>
            <div id="prev-feedback-text"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="nav" id="outputs-nav">
      <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">&#8592; 上一个</button>
      <button class="done-btn" id="done-btn" onclick="showDoneDialog()">提交所有评审</button>
      <button class="nav-btn" id="next-btn" onclick="navigate(1)">下一个 &#8594;</button>
    </div>
    </div><!-- end panel-outputs -->

    <!-- Benchmark panel (quantitative stats) -->
    <div class="view-panel" id="panel-benchmark">
      <div class="benchmark-view" id="benchmark-content">
        <div class="benchmark-empty">暂无基准测试数据。请先运行基准测试以查看量化结果。</div>
      </div>
    </div>
  </div>

  <!-- Done overlay -->
  <div class="done-overlay" id="done-overlay">
    <div class="done-card">
      <h2>评审完成</h2>
      <p>你的反馈已保存。返回 Claude Code 会话并告诉 Claude 你已完成评审。</p>
      <div class="btn-row">
        <button onclick="closeDoneDialog()">确定</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>

    // ---- State ----
    let feedbackMap = {};  // run_id -> feedback text
    let currentIndex = 0;
    let visitedRuns = new Set();

    // ---- Init ----
    async function init() {
      // Load saved feedback from server — but only if this isn't a fresh
      // iteration (indicated by previous_feedback being present). When
      // previous feedback exists, the feedback.json on disk is stale from
      // the prior iteration and should not pre-fill the textareas.
      const hasPrevious = Object.keys(EMBEDDED_DATA.previous_feedback || {}).length > 0
        || Object.keys(EMBEDDED_DATA.previous_outputs || {}).length > 0;
      if (!hasPrevious) {
        try {
          const resp = await fetch("/api/feedback");
          const data = await resp.json();
          if (data.reviews) {
            for (const r of data.reviews) feedbackMap[r.run_id] = r.feedback;
          }
        } catch { /* first run, no feedback yet */ }
      }

      document.getElementById("skill-name").textContent = EMBEDDED_DATA.skill_name;
      showRun(0);

      // Wire up feedback auto-save
      const textarea = document.getElementById("feedback");
      let saveTimeout = null;
      textarea.addEventListener("input", () => {
        clearTimeout(saveTimeout);
        document.getElementById("feedback-status").textContent = "";
        saveTimeout = setTimeout(() => saveCurrentFeedback(), 800);
      });
    }

    // ---- Navigation ----
    function navigate(delta) {
      const newIndex = currentIndex + delta;
      if (newIndex >= 0 && newIndex < EMBEDDED_DATA.runs.length) {
        saveCurrentFeedback();
        showRun(newIndex);
      }
    }

    function updateNavButtons() {
      document.getElementById("prev-btn").disabled = currentIndex === 0;
      document.getElementById("next-btn").disabled =
        currentIndex === EMBEDDED_DATA.runs.length - 1;
    }

    // ---- Show a run ----
    function showRun(index) {
      currentIndex = index;
      const run = EMBEDDED_DATA.runs[index];

      // Progress
      document.getElementById("progress").textContent =
        `${index + 1} of ${EMBEDDED_DATA.runs.length}`;

      // Prompt
      document.getElementById("prompt-text").textContent = run.prompt;

      // Config badge
      const badge = document.getElementById("config-badge");
      const configMatch = run.id.match(/(with_skill|without_skill|new_skill|old_skill)/);
      if (configMatch) {
        const config = configMatch[1];
        const isBaseline = config === "without_skill" || config === "old_skill";
        badge.textContent = config.replace(/_/g, " ");
        badge.className = "config-badge " + (isBaseline ? "config-baseline" : "config-primary");
        badge.style.display = "inline-block";
      } else {
        badge.style.display = "none";
      }

      // Outputs
      renderOutputs(run);

      // Previous outputs
      renderPrevOutputs(run);

      // Grades
      renderGrades(run);

      // Previous feedback
      const prevFb = (EMBEDDED_DATA.previous_feedback || {})[run.id];
      const prevEl = document.getElementById("prev-feedback");
      if (prevFb) {
        document.getElementById("prev-feedback-text").textContent = prevFb;
        prevEl.style.display = "block";
      } else {
        prevEl.style.display = "none";
      }

      // Feedback
      document.getElementById("feedback").value = feedbackMap[run.id] || "";
      document.getElementById("feedback-status").textContent = "";

      updateNavButtons();

      // Track visited runs and promote done button when all visited
      visitedRuns.add(index);
      const doneBtn = document.getElementById("done-btn");
      if (visitedRuns.size >= EMBEDDED_DATA.runs.length) {
        doneBtn.classList.add("ready");
      }

      // Scroll main content to top
      document.querySelector(".main").scrollTop = 0;
    }

    // ---- Render outputs ----
    function renderOutputs(run) {
      const container = document.getElementById("outputs-body");
      container.innerHTML = "";

      const outputs = run.outputs || [];
      if (outputs.length === 0) {
        container.innerHTML = '<div class="empty-state">无输出文件</div>';
        return;
      }

      for (const file of outputs) {
        const fileDiv = document.createElement("div");
        fileDiv.className = "output-file";

        // Always show file header with download link
        const header = document.createElement("div");
        header.className = "output-file-header";
        const nameSpan = document.createElement("span");
        nameSpan.textContent = file.name;
        header.appendChild(nameSpan);
        const dlBtn = document.createElement("a");
        dlBtn.className = "dl-btn";
        dlBtn.textContent = "下载";
        dlBtn.download = file.name;
        dlBtn.href = getDownloadUri(file);
        header.appendChild(dlBtn);
        fileDiv.appendChild(header);

        const content = document.createElement("div");
        content.className = "output-file-content";

        if (file.type === "text") {
          const pre = document.createElement("pre");
          pre.textContent = file.content;
          content.appendChild(pre);
        } else if (file.type === "image") {
          const img = document.createElement("img");
          img.src = file.data_uri;
          img.alt = file.name;
          content.appendChild(img);
        } else if (file.type === "pdf") {
          const iframe = document.createElement("iframe");
          iframe.src = file.data_uri;
          content.appendChild(iframe);
        } else if (file.type === "xlsx") {
          renderXlsx(content, file.data_b64);
        } else if (file.type === "binary") {
          const a = document.createElement("a");
          a.className = "download-link";
          a.href = file.data_uri;
          a.download = file.name;
          a.textContent = "下载 " + file.name;
          content.appendChild(a);
        } else if (file.type === "error") {
          const pre = document.createElement("pre");
          pre.textContent = file.content;
          pre.style.color = "var(--red)";
          content.appendChild(pre);
        }

        fileDiv.appendChild(content);
        container.appendChild(fileDiv);
      }
    }

    // ---- XLSX rendering via SheetJS ----
    function renderXlsx(container, b64Data) {
      try {
        const raw = Uint8Array.from(atob(b64Data), c => c.charCodeAt(0));
        const wb = XLSX.read(raw, { type: "array" });

        for (let i = 0; i < wb.SheetNames.length; i++) {
          const sheetName = wb.SheetNames[i];
          const ws = wb.Sheets[sheetName];

          if (wb.SheetNames.length > 1) {
            const sheetLabel = document.createElement("div");
            sheetLabel.style.cssText =
              "font-weight:600; font-size:0.8rem; color:#b0aea5; margin-top:0.5rem; margin-bottom:0.25rem;";
            sheetLabel.textContent = "工作表：" + sheetName;
            container.appendChild(sheetLabel);
          }

          const htmlStr = XLSX.utils.sheet_to_html(ws, { editable: false });
          const wrapper = document.createElement("div");
          wrapper.innerHTML = htmlStr;
          container.appendChild(wrapper);
        }
      } catch (err) {
        container.textContent = "渲染表格出错：" + err.message;
      }
    }

    // ---- Grades ----
    function renderGrades(run) {
      const section = document.getElementById("grades-section");
      const content = document.getElementById("grades-content");

      if (!run.grading && !run.compliance && !run.calibration) {
        section.style.display = "none";
        return;
      }

      section.style.display = "block";
      content.classList.remove("open");
      document.getElementById("grades-arrow").classList.remove("open");

      let html = '<div style="padding: 1rem;">';

      // ── Compliance ──
      if (run.compliance) {
        const cr = run.compliance;
        const rateColor = cr.compliance_rate >= 0.7 ? "var(--green)" : cr.compliance_rate >= 0.5 ? "var(--accent)" : "var(--red)";
        html += '<div style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border);">';
        html += '<strong>合规性：</strong> <span style="color:' + rateColor + ';font-weight:600;">' + (cr.compliance_rate != null ? (cr.compliance_rate * 100).toFixed(0) + '%' : '—') + '</span>';
        html += '（' + (cr.followed_count || 0) + '/' + (cr.total_instructions || 0) + ' 条指令已遵循）';
        if (cr.warnings && cr.warnings.length) {
          html += '<ul style="font-size:0.75rem;color:var(--accent);margin:0.25rem 0 0 1.25rem;">';
          for (const w of cr.warnings) html += '<li>' + escapeHtml(w) + '</li>';
          html += '</ul>';
        }
        html += '</div>';
      }

      // ── Calibration ──
      if (run.calibration) {
        const cal = run.calibration;
        const gradeColor = cal.grade === "HIGH" ? "var(--green)" : cal.grade === "MEDIUM" ? "var(--accent)" : cal.grade === "LOW" ? "var(--text-muted)" : "var(--red)";
        html += '<div style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border);">';
        html += '<strong>校准等级：</strong> <span style="color:' + gradeColor + ';font-weight:600;">' + (cal.grade || "—") + '</span>';
        html += '（一致性：' + (cal.agreement_rate != null ? (cal.agreement_rate * 100).toFixed(0) + '%' : '—') + '，整体置信度：' + (cal.overall_confidence != null ? cal.overall_confidence.toFixed(2) : '—') + '）';
        if (cal.recommendations && cal.recommendations.length) {
          html += '<ul style="font-size:0.75rem;margin:0.25rem 0 0 1.25rem;">';
          for (const r of cal.recommendations) html += '<li>' + escapeHtml(r) + '</li>';
          html += '</ul>';
        }
        html += '</div>';
      }

      // ── Grading ──
      if (run.grading) {
        const grading = run.grading;
        const summary = grading.summary || {};
        const expectations = grading.expectations || [];

        // Summary line
        const passRate = summary.pass_rate != null
          ? Math.round(summary.pass_rate * 100) + "%"
          : "?";
        const badgeClass = summary.pass_rate >= 0.8 ? "grade-pass" : summary.pass_rate >= 0.5 ? "" : "grade-fail";
        html += '<div class="grades-summary">';
        html += '<span class="grade-badge ' + badgeClass + '">' + passRate + '</span>';
        html += '<span>' + (summary.passed || 0) + ' 通过，' + (summary.failed || 0) + ' 失败，共 ' + (summary.total || 0) + ' 项</span>';
        html += '</div>';

        html += '<ul class="assertion-list">';
        for (const exp of expectations) {
          const statusClass = exp.passed ? "pass" : "fail";
          const statusIcon = exp.passed ? "\u2713" : "\u2717";
          html += '<li class="assertion-item">';
          html += '<span class="assertion-status ' + statusClass + '">' + statusIcon + '</span>';
          html += '<span>' + escapeHtml(exp.text) + '</span>';
          if (exp.evidence) {
            html += '<div class="assertion-evidence">' + escapeHtml(exp.evidence) + '</div>';
          }
          html += '</li>';
        }
        html += '</ul>';
      }

      html += '</div>';
      content.innerHTML = html;
    }

    function toggleGrades() {
      const content = document.getElementById("grades-content");
      const arrow = document.getElementById("grades-arrow");
      content.classList.toggle("open");
      arrow.classList.toggle("open");

    // ---- Feedback (saved to server -> feedback.json) ----
    function saveCurrentFeedback() {
      const run = EMBEDDED_DATA.runs[currentIndex];
      const text = document.getElementById("feedback").value;

      if (text.trim() === "") {
        delete feedbackMap[run.id];
      } else {
        feedbackMap[run.id] = text;
      }

      // Build reviews array from map
      const reviews = [];
      for (const [run_id, feedback] of Object.entries(feedbackMap)) {
        if (feedback.trim()) {
          reviews.push({ run_id, feedback, timestamp: new Date().toISOString() });
        }
      }

      fetch("/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reviews, status: "in_progress" }),
      }).then(() => {
        document.getElementById("feedback-status").textContent = "已保存";
      }).catch(() => {
        // Static mode or server unavailable — no-op on auto-save,
        // feedback will be downloaded on final submit
        document.getElementById("feedback-status").textContent = "提交时下载";
      });
    }

    // ---- Done ----
    function showDoneDialog() {
      // Save current textarea to feedbackMap (but don't POST yet)
      const run = EMBEDDED_DATA.runs[currentIndex];
      const text = document.getElementById("feedback").value;
      if (text.trim() === "") {
        delete feedbackMap[run.id];
      } else {
        feedbackMap[run.id] = text;
      }

      // POST once with status: complete — include ALL runs so the model
      // can distinguish "no feedback" (looks good) from "not reviewed"
      const reviews = [];
      const ts = new Date().toISOString();
      for (const r of EMBEDDED_DATA.runs) {
        reviews.push({ run_id: r.id, feedback: feedbackMap[r.id] || "", timestamp: ts });
      }
      const payload = JSON.stringify({ reviews, status: "complete" }, null, 2);
      fetch("/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
      }).then(() => {
        document.getElementById("done-overlay").classList.add("visible");
      }).catch(() => {
        // Server not available (static mode) — download as file
        const blob = new Blob([payload], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "feedback.json";
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById("done-overlay").classList.add("visible");
      });
    }

    function closeDoneDialog() {
      // Reset status back to in_progress
      saveCurrentFeedback();
      document.getElementById("done-overlay").classList.remove("visible");
    }

    // ---- Toast ----
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 2000);
    }

    // ---- Keyboard nav ----
    document.addEventListener("keydown", (e) => {
      // Don't capture when typing in textarea
      if (e.target.tagName === "TEXTAREA") return;

      if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        e.preventDefault();
        navigate(-1);
      } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        e.preventDefault();
        navigate(1);
      }
    });

    // ---- Util ----
    function getDownloadUri(file) {
      if (file.data_uri) return file.data_uri;
      if (file.data_b64) return "data:application/octet-stream;base64," + file.data_b64;
      if (file.type === "text") return "data:text/plain;charset=utf-8," + encodeURIComponent(file.content);
      return "#";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // ---- View switching ----
    function switchView(view) {
      document.querySelectorAll(".view-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
      document.querySelector(`[onclick="switchView('${view}')"]`).classList.add("active");
      document.getElementById("panel-" + view).classList.add("active");
    }

    // ---- Benchmark rendering ----
    function renderBenchmark() {
      const data = EMBEDDED_DATA.benchmark;
      if (!data) return;

      document.getElementById("view-tabs").style.display = "flex";

      const container = document.getElementById("benchmark-content");
      const summary = data.run_summary || {};
      const metadata = data.metadata || {};
      const notes = data.notes || [];
      const comparisons = data.comparisons || [];
      const analysis = data.analysis || null;

      let html = "";

      // ── Dashboard header ──
      html += "<div style='display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;'>";
      const configs = Object.keys(summary).filter(k => k !== "delta");
      const configA = configs[0] || "";
      const configB = configs[1] || "";
      const delta = summary.delta || {};
      const a = summary[configA] || {};
      const b = summary[configB] || {};

      const prDelta = delta.pass_rate || "—";
      const prNum = parseFloat(prDelta);
      const prGood = prNum > 0.05;

      function mkCard(title, value, sub, color) {
        return '<div style="flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;text-align:center;">'
          + '<div style="font-size:0.75rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.5rem;">' + title + '</div>'
          + '<div style="font-size:1.8rem;font-family:Poppins,sans-serif;font-weight:600;color:' + color + ';">' + value + '</div>'
          + (sub ? '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.25rem;">' + sub + '</div>' : '')
          + '</div>';
      }

      html += mkCard("通过率变化 (Δ)", (prNum > 0 ? "+" : "") + prDelta,
        prGood ? "Skill 提升了 Claude" : prNum < -0.05 ? "Skill 拖累了 Claude" : "Skill 效果不明显",
        prGood ? "var(--green)" : prNum < -0.05 ? "var(--red)" : "var(--text-muted)");

      if (metadata.runs_per_configuration) {
        html += mkCard("每组运行次数", metadata.runs_per_configuration, "with_skill / without_skill", "var(--text)");
      }
      if (metadata.evals_run && metadata.evals_run.length) {
        html += mkCard("评测数", metadata.evals_run.length, metadata.evals_run.join(", "), "var(--text)");
      }
      if (metadata.skill_name) {
        html += mkCard("Skill", metadata.skill_name, "", "var(--accent)");
      }
      html += "</div>";

      // ── Anomaly Report ──
      const anomalyReport = data.anomaly_report;
      if (anomalyReport && anomalyReport.anomalies && anomalyReport.anomalies.length > 0) {
        html += '<div style="background:#fff3cd;border:1px solid #ffc107;border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem;">';
        html += '<div style="font-family:Poppins,sans-serif;font-size:0.8rem;font-weight:600;color:#856404;margin-bottom:0.5rem;">⚠ 异常检测 (' + anomalyReport.anomaly_count + ' 个异常)</div>';
        for (const a of anomalyReport.anomalies) {
          html += '<div style="font-size:0.75rem;color:#856404;margin-bottom:0.25rem;">';
          html += '<strong>' + escapeHtml(a.anomaly_type || "?") + '</strong>: Eval ' + a.eval_id + ' ' + escapeHtml(a.eval_name || "") + ' / ' + escapeHtml(a.configuration || "") + ' run-' + a.run_number;
          if (a.detail) html += '<br/><span style="color:#926d00;">' + escapeHtml(a.detail) + '</span>';
          html += '</div>';
        }
        if (anomalyReport.retried_count) {
          html += '<div style="font-size:0.75rem;color:#856404;margin-top:0.5rem;">重试次数: ' + anomalyReport.retried_count + '</div>';
        }
        html += '</div>';
      }

      // ── Scorecard (static analysis) ──
      const scorecard = EMBEDDED_DATA.scorecard;
      if (scorecard && (scorecard.checks || scorecard.score !== undefined)) {
        html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem;">';
        html += '<div class="section-header" style="margin:-1rem -1rem 1rem -1rem;">静态分析记分卡</div>';
        const scoreColor = scorecard.score >= 8 ? "var(--green)" : scorecard.score >= 5 ? "var(--accent)" : "var(--red)";
        html += '<div style="text-align:center;margin-bottom:0.75rem;"><span style="font-size:2rem;font-family:Poppins,sans-serif;font-weight:600;color:' + scoreColor + ';">' + (scorecard.score || 0) + '/' + (scorecard.max_score || 11) + '</span>';
        html += ' <span style="color:var(--text-muted);">' + (scorecard.category || "") + '</span></div>';
        if (scorecard.checks) {
          html += '<table class="benchmark-table"><thead><tr><th>检查项</th><th>状态</th><th>详情</th></tr></thead><tbody>';
          for (const ck of scorecard.checks) {
            const statusIcon = ck.passed ? '<span style="color:var(--green);">✓</span>' : '<span style="color:var(--red);">✗</span>';
            html += '<tr><td>' + escapeHtml(ck.name || "") + '</td><td>' + statusIcon + '</td><td style="font-size:0.75rem;color:var(--text-muted);">' + escapeHtml(ck.message || "") + '</td></tr>';
          }
          html += '</tbody></table>';
        }
        html += '</div>';
      }

      // ── Overfitting ──
      const overfit = EMBEDDED_DATA.overfitting;
      if (overfit) {
        html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem;">';
        html += '<div class="section-header" style="margin:-1rem -1rem 1rem -1rem;">过拟合分析</div>';

        const gap = overfit.generalization_gap;
        if (gap) {
          const gapColor = gap.verdict === "good" ? "var(--green)" : gap.verdict === "warn" ? "var(--accent)" : "var(--red)";
          html += '<div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:0.75rem;">';
          html += '<div style="flex:1;min-width:150px;background:var(--bg);border-radius:var(--radius);padding:0.75rem;text-align:center;">';
          html += '<div style="font-size:0.7rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.25rem;">领域 Δ</div>';
          html += '<div style="font-size:1.3rem;font-family:Poppins,sans-serif;font-weight:600;">' + (gap.domain_delta > 0 ? '+' : '') + gap.domain_delta.toFixed(2) + '</div>';
          html += '<div style="font-size:0.7rem;color:var(--text-muted);">ws ' + (gap.domain_pass_rate_with * 100).toFixed(0) + '% / wos ' + (gap.domain_pass_rate_without * 100).toFixed(0) + '%</div>';
          html += '</div>';
          html += '<div style="flex:1;min-width:150px;background:var(--bg);border-radius:var(--radius);padding:0.75rem;text-align:center;">';
          html += '<div style="font-size:0.7rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.25rem;">通用 Δ</div>';
          html += '<div style="font-size:1.3rem;font-family:Poppins,sans-serif;font-weight:600;">' + (gap.general_delta > 0 ? '+' : '') + gap.general_delta.toFixed(2) + '</div>';
          html += '<div style="font-size:0.7rem;color:var(--text-muted);">ws ' + (gap.general_pass_rate_with * 100).toFixed(0) + '% / wos ' + (gap.general_pass_rate_without * 100).toFixed(0) + '%</div>';
          html += '</div>';
          html += '<div style="flex:1;min-width:120px;background:var(--bg);border-radius:var(--radius);padding:0.75rem;text-align:center;">';
          html += '<div style="font-size:0.7rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.25rem;">差距</div>';
          html += '<div style="font-size:1.3rem;font-family:Poppins,sans-serif;font-weight:600;color:' + gapColor + ';">' + gap.gap.toFixed(2) + '</div>';
          html += '<div style="font-size:0.7rem;color:' + gapColor + ';text-transform:uppercase;">' + gap.verdict + '</div>';
          html += '</div></div>';
        }

        html += '<div style="font-size:1.1rem;font-family:Poppins,sans-serif;margin-bottom:0.5rem;">过拟合得分：<span style="color:' + (overfit.overfitting_score >= 0.7 ? 'var(--red)' : overfit.overfitting_score >= 0.4 ? 'var(--accent)' : 'var(--green)') + ';">' + (overfit.overfitting_score * 100).toFixed(0) + '%</span></div>';

        if (overfit.recommendation) {
          html += '<div style="margin-top:0.75rem;padding:0.5rem 0.75rem;background:var(--bg);border-radius:var(--radius);font-size:0.8125rem;">' + escapeHtml(overfit.recommendation) + '</div>';
        }

        html += '</div>';
      }

      // ── Security vet report ──
      const vetReport = EMBEDDED_DATA.vet_report;
      if (vetReport) {
        html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem;">';
        html += '<div class="section-header" style="margin:-1rem -1rem 1rem -1rem;">安全审查</div>';

        const verdictColor = vetReport.verdict === "SAFE" ? "var(--green)" : vetReport.verdict === "BLOCKED" ? "var(--red)" : "var(--accent)";
        html += '<div style="text-align:center;margin-bottom:1rem;">';
        html += '<span style="font-size:1.5rem;font-family:Poppins,sans-serif;font-weight:600;color:' + verdictColor + ';">' + escapeHtml(vetReport.verdict || "—") + '</span>';
        if (vetReport.summary) {
          html += '<div style="font-size:0.8125rem;color:var(--text-muted);margin-top:0.25rem;">' + escapeHtml(vetReport.summary) + '</div>';
        }
        html += '</div>';

        if (vetReport.scanners && vetReport.scanners.length > 0) {
          html += '<table style="width:100%;border-collapse:collapse;font-size:0.8125rem;">';
          html += '<thead><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;padding:0.5rem;">扫描器</th><th style="text-align:center;padding:0.5rem;">状态</th><th style="text-align:left;padding:0.5rem;">详情</th></tr></thead><tbody>';
          for (const s of vetReport.scanners) {
            const statusIcon = s.status === "PASS" ? "✓" : s.status === "FAIL" ? "✗" : "—";
            const statusColor = s.status === "PASS" ? "var(--green)" : s.status === "FAIL" ? "var(--red)" : s.status === "WARN" ? "var(--accent)" : "var(--text-muted)";
            html += '<tr style="border-bottom:1px solid var(--border);">';
            html += '<td style="padding:0.5rem;font-weight:500;">' + escapeHtml(s.name || "") + '</td>';
            html += '<td style="text-align:center;padding:0.5rem;color:' + statusColor + ';font-weight:600;">' + statusIcon + ' ' + escapeHtml(s.status || "") + '</td>';
            html += '<td style="padding:0.5rem;color:var(--text-muted);">' + escapeHtml(s.message || "") + '</td>';
            html += '</tr>';
          }
          html += '</tbody></table>';
        }

        if (vetReport.findings && vetReport.findings.length > 0) {
          html += '<div style="margin-top:0.75rem;font-size:0.8125rem;">';
          html += '<div style="font-weight:600;margin-bottom:0.25rem;">发现的问题：</div>';
          for (const f of vetReport.findings) {
            const sevColor = (f.severity === "CRITICAL" || f.severity === "HIGH") ? "var(--red)" : f.severity === "MEDIUM" ? "var(--accent)" : "var(--text-muted)";
            html += '<div style="padding:0.25rem 0.5rem;margin:0.25rem 0;background:var(--bg);border-radius:var(--radius);">';
            html += '<span style="color:' + sevColor + ';font-weight:500;">[' + escapeHtml(f.severity || "") + ']</span> ';
            html += escapeHtml(f.description || "");
            if (f.file_path) html += ' <span style="color:var(--text-muted);">(' + escapeHtml(f.file_path) + (f.line ? ':' + f.line : '') + ')</span>';
            html += '</div>';
          }
          html += '</div>';
        }

        html += '</div>';
      }

      // ── Pass rate bar chart ──
      if (configA && configB) {
        html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem;">';
        html += '<div class="section-header" style="margin:-1rem -1rem 1rem -1rem;">通过率对比</div>';
        html += '<div style="max-width:500px;margin:0 auto;"><canvas id="passRateChart" style="max-height:200px;"></canvas></div>';
        html += '</div>';
      }

      // ── Delta table ──
      html += '<table class="benchmark-table">';
      html += "<thead><tr><th>指标</th><th>" + escapeHtml(configA.replace(/_/g, ' ')) + "</th><th>" + escapeHtml(configB.replace(/_/g, ' ')) + "</th><th>变化</th></tr></thead><tbody>";

      function fmtStat(stat, pct) {
        if (!stat) return "—";
        const suffix = pct ? "%" : "";
        const m = pct ? (stat.mean * 100).toFixed(0) : stat.mean.toFixed(1);
        const s = pct ? (stat.stddev * 100).toFixed(0) : stat.stddev.toFixed(1);
        return m + suffix + " ± " + s + suffix;
      }
      function deltaClass(val) {
        if (!val) return "";
        const n = parseFloat(val);
        if (n > 0) return "benchmark-delta-positive";
        if (n < 0) return "benchmark-delta-negative";
        return "";
      }

      html += "<tr><td><strong>通过率</strong></td>";
      html += "<td>" + fmtStat(a.pass_rate, true) + "</td>";
      html += "<td>" + fmtStat(b.pass_rate, true) + "</td>";
      html += '<td class="' + deltaClass(delta.pass_rate) + '">' + (delta.pass_rate || "—") + "</td></tr>";

      if (a.time_seconds || b.time_seconds) {
        html += "<tr><td><strong>耗时 (秒)</strong></td><td>" + fmtStat(a.time_seconds, false) + "</td><td>" + fmtStat(b.time_seconds, false) + "</td>";
        html += '<td class="' + deltaClass(delta.time_seconds) + '">' + (delta.time_seconds ? delta.time_seconds + "秒" : "—") + "</td></tr>";
      }
      if (a.tokens || b.tokens) {
        html += "<tr><td><strong>令牌数</strong></td><td>" + fmtStat(a.tokens, false) + "</td><td>" + fmtStat(b.tokens, false) + "</td>";
        html += '<td class="' + deltaClass(delta.tokens) + '">' + (delta.tokens || "—") + "</td></tr>";
      }
      html += "</tbody></table>";

      // ── Blind Comparison section ──
      if (comparisons.length > 0) {
        html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-top:1.5rem;">';
        html += '<div class="section-header" style="margin:-1rem -1rem 1rem -1rem;">盲评对比</div>';

        for (let ci = 0; ci < comparisons.length; ci++) {
          const comp = comparisons[ci];
          if (ci > 0) html += '<hr style="border:0;border-top:1px solid var(--border);margin:1rem 0;">';

          const wBadge = comp.winner === "A" ? "With Skill" : comp.winner === "B" ? "Without Skill" : "平局";
          const wColor = comp.winner === "A" ? "var(--green)" : comp.winner === "B" ? "var(--red)" : "var(--text-muted)";
          html += '<div style="margin-bottom:0.75rem;"><strong>胜者：</strong> <span style="color:' + wColor + ';font-weight:600;">' + wBadge + '</span></div>';
          html += '<div style="font-size:0.8125rem;color:var(--text-muted);margin-bottom:0.75rem;">' + escapeHtml(comp.reasoning || "") + '</div>';

          // Rubric scores
          if (comp.rubric && (comp.rubric.A || comp.rubric.B)) {
            html += '<div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:0.75rem;">';
            for (const side of ["A", "B"]) {
              const r = comp.rubric[side] || {};
              const label = side === "A" ? "With Skill" : "Without Skill";
              const scoreColor = r.overall_score >= 8 ? "var(--green)" : r.overall_score >= 5 ? "var(--accent)" : "var(--red)";
              html += '<div style="flex:1;min-width:180px;background:var(--bg);border-radius:var(--radius);padding:0.75rem;">';
              html += '<div style="font-weight:600;margin-bottom:0.5rem;">' + label + ' <span style="color:' + scoreColor + ';font-size:1.1rem;">' + (r.overall_score || "?").toFixed(1) + '</span>/10</div>';
              if (r.content) {
              html += '<div style="font-size:0.75rem;color:var(--text-muted);">内容：' + r.content_score.toFixed(1) + '/5 · 结构：' + r.structure_score.toFixed(1) + '/5</div>';
              }
              html += '</div>';
            }
            html += '</div>';
          }

          // Quality highlights
          if (comp.output_quality && (comp.output_quality.A || comp.output_quality.B)) {
            html += '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;">';
            for (const side of ["A", "B"]) {
              const q = comp.output_quality[side] || {};
              const label = side === "A" ? "A" : "B";
              html += '<div style="flex:1;min-width:160px;font-size:0.75rem;">';
              html += '<strong>' + label + '</strong>: ' + (q.score || "?") + '/10';
              if (q.strengths && q.strengths.length) html += '<br><span style="color:var(--green);">+</span> ' + escapeHtml(q.strengths[0]);
              if (q.weaknesses && q.weaknesses.length) html += '<br><span style="color:var(--red);">-</span> ' + escapeHtml(q.weaknesses[0]);
              html += '</div>';
            }
            html += '</div>';
          }
        }
        html += '</div>';
      }

      // ── Analysis section ──
      if (analysis && (analysis.winner_strengths || analysis.improvement_suggestions)) {
        html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-top:1.5rem;">';
        html += '<div class="section-header" style="margin:-1rem -1rem 1rem -1rem;">深度分析</div>';

        if (analysis.instruction_following) {
          const fi = analysis.instruction_following;
          const wsIf = fi.winner || fi.A || {};
          const lsIf = fi.loser || fi.B || {};
          html += '<div style="display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap;">';
          html += '<div style="flex:1;min-width:150px;"><strong>胜者指令遵循度：</strong> ' + (wsIf.score || "?") + '/10</div>';
          html += '<div style="flex:1;min-width:150px;"><strong>败者指令遵循度：</strong> ' + (lsIf.score || "?") + '/10</div>';
          html += '</div>';
        }

        if (analysis.winner_strengths && analysis.winner_strengths.length) {
          html += '<div style="margin-bottom:0.75rem;"><strong style="color:var(--green);">胜者优势</strong><ul style="font-size:0.8125rem;margin:0.25rem 0 0 1.25rem;">';
          for (const s of analysis.winner_strengths) html += '<li>' + escapeHtml(s) + '</li>';
          html += '</ul></div>';
        }

        if (analysis.loser_weaknesses && analysis.loser_weaknesses.length) {
          html += '<div style="margin-bottom:0.75rem;"><strong style="color:var(--red);">败者弱点</strong><ul style="font-size:0.8125rem;margin:0.25rem 0 0 1.25rem;">';
          for (const w of analysis.loser_weaknesses) html += '<li>' + escapeHtml(w) + '</li>';
          html += '</ul></div>';
        }

        if (analysis.improvement_suggestions && analysis.improvement_suggestions.length) {
          html += '<strong>改进建议</strong>';
          html += '<table class="benchmark-table" style="margin-top:0.5rem;"><thead><tr><th>优先级</th><th>类别</th><th>建议</th><th>预期影响</th></tr></thead><tbody>';
          for (const s of analysis.improvement_suggestions) {
            const prioColor = s.priority === "high" ? "var(--red)" : s.priority === "medium" ? "var(--accent)" : "var(--text-muted)";
            html += '<tr><td><span style="color:' + prioColor + ';font-weight:600;text-transform:uppercase;font-size:0.7rem;">' + escapeHtml(s.priority) + '</span></td>';
            html += '<td>' + escapeHtml(s.category || "") + '</td>';
            html += '<td style="font-size:0.8125rem;">' + escapeHtml(s.suggestion || "") + '</td>';
            html += '<td style="font-size:0.75rem;color:var(--text-muted);">' + escapeHtml(s.expected_impact || "") + '</td></tr>';
          }
          html += '</tbody></table>';
        }
        html += '</div>';
      }

      // ── Checkpoint breakdowns (dict notes) ──
      const checkpoints = notes.filter(n => typeof n === 'object' && n !== null);
      if (checkpoints.length > 0) {
        html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-top:1.5rem;">';
        html += '<div class="section-header" style="margin:-1rem -1rem 1rem -1rem;">检查点明细</div>';
        for (const cp of checkpoints) {
          const cpRate = cp.pass_rate || 0;
          const cpColor = cpRate >= 0.8 ? "var(--green)" : cpRate >= 0.5 ? "var(--accent)" : "var(--red)";
          const cpStatus = cpRate >= 0.8 ? "PASS" : cpRate >= 0.5 ? "PARTIAL" : "FAIL";
          html += '<div style="margin-bottom:0.75rem;">';
          html += '<span style="color:' + cpColor + ';font-weight:600;">' + cpStatus + '</span> ';
          html += '<strong>' + escapeHtml(cp.eval_name || "Checkpoint") + '</strong>';
          html += ' — ' + (cp.passed || 0) + '/' + (cp.total || 0) + ' (' + (cpRate * 100).toFixed(0) + '%)';
          html += '</div>';

          if (cp.expectations && cp.expectations.length) {
            html += '<ul style="font-size:0.75rem;margin:0 0 0.5rem 1.25rem;">';
            for (const e of cp.expectations) {
              let icon = e.passed ? '<span style="color:var(--green);">✓</span>' : '<span style="color:var(--red);">✗</span>';
              if (e.verdict === "UNEVAL") {
                icon = '<span style="color:var(--accent);" title="无法评估">?</span>';
              }
              html += '<li>' + icon + ' ' + escapeHtml(e.text || "") + '</li>';
            }
            html += '</ul>';
          }
          if (cp.assertions && cp.assertions.length) {
            html += '<ul style="font-size:0.75rem;margin:0 0 0.5rem 1.25rem;">';
            for (const a of cp.assertions) {
              let icon = a.passed ? '<span style="color:var(--green);">✓</span>' : '<span style="color:var(--red);">✗</span>';
              if (a.verdict === "UNEVAL") {
                icon = '<span style="color:var(--accent);" title="无法评估">?</span>';
              } else if (a.verdict === "TIMEOUT") {
                icon = '<span style="color:var(--accent);" title="超时">⏱</span>';
              } else if (a.verdict === "ERROR") {
                icon = '<span style="color:var(--red);" title="错误">!</span>';
              }
              const tierBadge = a.tier ? ' <small style="color:var(--text-muted);">[' + a.tier + ']</small>' : '';
              html += '<li style="color:var(--text-muted);">' + icon + ' <em>(assertion)</em> ' + escapeHtml(a.text || "") + tierBadge + '</li>';
            }
            html += '</ul>';
          }
        }
        html += '</div>';
      }

      // ── Per-eval breakdown table ──
      const runs = data.runs || [];
      if (runs.length > 0) {
        const evalIds = [...new Set(runs.map(r => r.eval_id))].sort((a, b) => a - b);
        html += '<div style="margin-top:1.5rem;"><h3 style="font-family:Poppins,sans-serif;margin-bottom:0.75rem;">逐项评测明细</h3>';
        const hasTime = runs.some(r => r.result && r.result.time_seconds != null);

        for (const evalId of evalIds) {
          const evalRuns = runs.filter(r => r.eval_id === evalId);
          const evalName = evalRuns[0] && evalRuns[0].eval_name ? evalRuns[0].eval_name : "Eval " + evalId;
          html += '<h4 style="font-family:Poppins,sans-serif;margin:1rem 0 0.5rem;">' + escapeHtml(evalName) + '</h4>';
          html += '<table class="benchmark-table"><thead><tr><th>配置</th><th>运行</th><th>通过率</th>';
          if (hasTime) html += '<th>耗时 (秒)</th>';
          html += '</tr></thead><tbody>';

          const configGroups = [...new Set(evalRuns.map(r => r.configuration))];
          for (let ci = 0; ci < configGroups.length; ci++) {
            const config = configGroups[ci];
            const configRuns = evalRuns.filter(r => r.configuration === config);
            if (configRuns.length === 0) continue;
            const rowClass = ci === 0 ? "benchmark-row-with" : "benchmark-row-without";
            const configLabel = config.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());

            for (const run of configRuns) {
              const r = run.result || {};
              const prClass = r.pass_rate >= 0.8 ? "benchmark-delta-positive" : r.pass_rate < 0.5 ? "benchmark-delta-negative" : "";
              const anomalyTag = run.is_anomaly ? ' <span style="background:#ffc107;color:#333;padding:0 4px;border-radius:3px;font-size:0.65rem;font-family:Poppins,sans-serif;" title="' + escapeHtml(run.anomaly_reason || '异常值') + '">异常</span>' : "";
              const retryTag = run.retry_count ? ' <span style="background:#e0e0e0;color:#666;padding:0 4px;border-radius:3px;font-size:0.65rem;font-family:Poppins,sans-serif;" title="重试 ' + run.retry_count + ' 次">R' + run.retry_count + '</span>' : "";
              html += '<tr class="' + rowClass + '"><td>' + configLabel + '</td><td>' + run.run_number + anomalyTag + retryTag + '</td>';
              html += '<td class="' + prClass + '">' + ((r.pass_rate || 0) * 100).toFixed(0) + '% (' + (r.passed || 0) + '/' + (r.total || 0) + ')</td>';
              if (hasTime) {
                const timeDisplay = r.time_seconds != null ? r.time_seconds.toFixed(1) : "—";
                const timeStyle = r.time_seconds > 300 ? 'color:var(--red);' : '';
                html += '<td style="' + timeStyle + '">' + timeDisplay + '</td>';
              }
              html += '</tr>';
            }

            const rates = configRuns.map(r => (r.result || {}).pass_rate || 0);
            const avgRate = rates.reduce((a, b) => a + b, 0) / rates.length;
            const avgPrClass = avgRate >= 0.8 ? "benchmark-delta-positive" : avgRate < 0.5 ? "benchmark-delta-negative" : "";
            html += '<tr class="benchmark-row-avg ' + rowClass + '"><td>' + configLabel + '</td><td>平均</td>';
            html += '<td class="' + avgPrClass + '">' + (avgRate * 100).toFixed(0) + '%</td>';
            if (hasTime) {
              const times = configRuns.map(r => (r.result || {}).time_seconds).filter(t => t != null);
              html += '<td>' + (times.length ? (times.reduce((a, b) => a + b, 0) / times.length).toFixed(1) : "—") + '</td>';
            }
            html += '</tr>';
          }
          html += '</tbody></table>';

          // Per-assertion detail
          const runsWithExpectations = {};
          for (const config of configGroups) {
            runsWithExpectations[config] = evalRuns.filter(r => r.configuration === config && r.expectations && r.expectations.length > 0);
          }
          const hasAnyExp = Object.values(runsWithExpectations).some(runs => runs.length > 0);
          if (hasAnyExp) {
            const allAssertions = [];
            const seen = new Set();
            for (const config of configGroups) {
              for (const run of runsWithExpectations[config]) {
                for (const exp of (run.expectations || [])) {
                  if (!seen.has(exp.text)) { seen.add(exp.text); allAssertions.push(exp.text); }
                }
              }
            }
            html += '<table class="benchmark-table" style="margin-top:0.5rem;"><thead><tr><th>断言</th>';
            for (const config of configGroups) {
              html += '<th>' + escapeHtml(config.replace(/_/g, " ")) + '</th>';
            }
            html += '</tr></thead><tbody>';
            for (const assertionText of allAssertions) {
              html += '<tr><td>' + escapeHtml(assertionText) + '</td>';
              for (const config of configGroups) {
                html += '<td>';
                for (const run of runsWithExpectations[config]) {
                  const exp = (run.expectations || []).find(e => e.text === assertionText);
                  if (exp) {
                    const cls = exp.passed ? "benchmark-delta-positive" : "benchmark-delta-negative";
                    html += '<span class="' + cls + '">' + (exp.passed ? "✓" : "✗") + '</span> ';
                  } else {
                    html += '— ';
                  }
                }
                html += '</td>';
              }
              html += '</tr>';
            }
            html += '</tbody></table>';
          }
        }
        html += '</div>';
      }

      // ── Analysis notes (string notes) ──
      const stringNotes = notes.filter(n => typeof n === 'string');
      if (stringNotes.length > 0) {
        html += '<div class="benchmark-notes" style="margin-top:1.5rem;">';
        html += '<h3>分析备注（' + stringNotes.length + '）</h3><ul>';
        for (const note of stringNotes) html += '<li>' + escapeHtml(note) + '</li>';
        html += '</ul></div>';
      }

      container.innerHTML = html;

      // ── Chart.js pass rate bar chart ──
      if (configA && configB) {
        setTimeout(() => {
          const canvas = document.getElementById("passRateChart");
          if (!canvas) return;
          const prA = a.pass_rate ? a.pass_rate.mean * 100 : 0;
          const prB = b.pass_rate ? b.pass_rate.mean * 100 : 0;
          new Chart(canvas, {
            type: "bar",
            data: {
              labels: [configA.replace(/_/g, " "), configB.replace(/_/g, " ")],
              datasets: [{
                label: "通过率 (%)",
                data: [prA, prB],
                backgroundColor: [prA >= prB ? "#788c5d" : "#c44", prB >= prA ? "#788c5d" : "#c44"],
                borderRadius: 4,
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + "%" } } }
            }
          });
        }, 100);
      }
    }

    // ---- Start ----
    init();
    renderBenchmark();
  </script>
</body>
</html>
