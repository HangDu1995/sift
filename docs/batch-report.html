    function renderDAG() {
      const container = document.getElementById("dag");
      const roots = allSkills.filter(s => !s.dependencies || s.dependencies.length === 0);
      const nonRoots = allSkills.filter(s => s.dependencies && s.dependencies.length > 0);

      if (nonRoots.length === 0) {
        // No dependencies — show flat list
        container.innerHTML = '<div class="dag-row">' +
          allSkills.map(s => renderDAGNode(s)).join("") + '</div>';
        return;
      }

      // Build levels by BFS from roots
      const levels = [];
      const visited = new Set();

      function bfs(startNodes) {
        const queue = [...startNodes];
        while (queue.length > 0) {
          const level = [...queue];
          queue.length = 0;
          const levelNodes = [];
          for (const name of level) {
            if (visited.has(name)) continue;
            visited.add(name);
            const skill = allSkills.find(s => s.name === name);
            if (skill) {
              levelNodes.push(skill);
              for (const child of (skill.depended_by || [])) {
                if (!visited.has(child)) queue.push(child);
              }
            }
          }
          if (levelNodes.length > 0) levels.push(levelNodes);
        }
      }

      const rootNames = roots.map(s => s.name);
      bfs(rootNames);

      // Also include any skills not in the DAG
      for (const s of allSkills) {
        if (!visited.has(s.name)) {
          if (levels.length === 0) levels.push([]);
          levels[levels.length - 1].push(s);
          visited.add(s.name);
        }
      }

      let html = "";
      for (let i = 0; i < levels.length; i++) {
        html += '<div class="dag-row">';
        for (const s of levels[i]) {
          html += renderDAGNode(s);
        }
        html += '</div>';
        if (i < levels.length - 1) {
          html += '<div class="dag-arrow" style="text-align:center;">↓</div>';
        }
      }

      container.innerHTML = html;
    }

    function renderDAGNode(s) {
      const statusClass = s.status === "PASSED" ? "badge-passed" :
        s.status === "FAILED" || s.status === "ROOT_CAUSE" || s.status === "DEPENDENCY_MISSING" ? "badge-failed" :
        s.status === "CASCADE" ? "badge-cascade" : "badge-skipped";
      const statusLabel = s.status === "ROOT_CAUSE" ? "FAILED (root)" :
        s.status === "CASCADE" ? "CASCADE" :
        s.status === "DEPENDENCY_MISSING" ? "DEP MISSING" : s.status;
      const delta = s.delta ? parseFloat(s.delta) : 0;
      const deltaClass = delta > 0.05 ? "delta-positive" : delta < -0.05 ? "delta-negative" : "";
      const deltaStr = s.delta ? (delta > 0 ? "+" : "") + s.delta : "—";

      return '<div class="dag-node" onclick="toggleDrilldown(\'' + s.name.replace(/'/g, "\\'") + '\')">' +
        '<div class="name">' + escapeHtml(s.name) + '</div>' +
        '<div class="info">' +
        '<span class="badge ' + statusClass + '">' + statusLabel + '</span> ' +
        'Δ <span class="' + deltaClass + '">' + deltaStr + '</span>' +
        (s.pass_rate_with != null ? ' · ' + (s.pass_rate_with * 100).toFixed(0) + '%' : '') +
        '</div></div>';
    }

    function renderSummary() {
      const table = document.getElementById("summary-table");
      const hasTime = allSkills.some(s => s.delta_time != null);
      const hasTokens = allSkills.some(s => s.delta_tokens != null);
      const hasComps = allSkills.some(s => s.has_comparisons);
      const hasAnalysis = allSkills.some(s => s.has_analysis);

      let html = "<thead><tr><th>Skill</th><th>Status</th><th>with_skill</th><th>without_skill</th><th>Delta</th>";
      if (hasTime) html += "<th>Δ Time</th>";
      if (hasTokens) html += "<th>Δ Tokens</th>";
      if (hasComps) html += "<th>Comparison</th>";
      if (hasAnalysis) html += "<th>Analysis</th>";
      html += "</tr></thead><tbody>";

      for (const s of allSkills) {
        const statusClass = s.status === "PASSED" ? "badge-passed" :
          s.status === "FAILED" || s.status === "ROOT_CAUSE" || s.status === "DEPENDENCY_MISSING" ? "badge-failed" :
          s.status === "CASCADE" ? "badge-cascade" : "badge-skipped";
        const delta = s.delta ? parseFloat(s.delta) : 0;
        const deltaClass = delta > 0.05 ? "delta-positive" : delta < -0.05 ? "delta-negative" : "";
        const wr = s.pass_rate_with != null ? (s.pass_rate_with * 100).toFixed(0) + "%" : "—";
        const wo = s.pass_rate_without != null ? (s.pass_rate_without * 100).toFixed(0) + "%" : "—";
        const dd = s.delta ? (delta > 0 ? "+" : "") + s.delta : "—";

        html += "<tr>" +
          "<td><strong>" + escapeHtml(s.name) + "</strong></td>" +
          "<td><span class='badge " + statusClass + "'>" + s.status + "</span></td>" +
          "<td>" + wr + "</td>" +
          "<td>" + wo + "</td>" +
          "<td class='" + deltaClass + "'>" + dd + "</td>";
        if (hasTime) html += "<td>" + (s.delta_time || "—") + "</td>";
        if (hasTokens) html += "<td>" + (s.delta_tokens || "—") + "</td>";
        if (hasComps) html += "<td>" + (s.has_comparisons ? "✓" : "—") + "</td>";
        if (hasAnalysis) html += "<td>" + (s.has_analysis ? "✓" : "—") + "</td>";
        html += "</tr>";
      }
      html += "</tbody>";
      table.innerHTML = html;
    }

        if (!bench) continue;
        const runs = bench.runs || [];
        const comps = bench.comparisons || [];
        const analysis = bench.analysis;

        html += '<div class="section-label">' + escapeHtml(s.name) + '</div>';
        html += '<div class="drilldown" id="drilldown-' + s.name.replace(/'/g, "\\'").replace(/\W/g, "_") + '">';

        // Quick stats
        const names = s.dependencies || [];
        if (names.length > 0 || (s.depended_by || []).length > 0) {
          html += '<div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem;">';
          if (names.length > 0) html += 'Depends on: ' + names.join(", ") + ' · ';
          if (s.depended_by && s.depended_by.length > 0) html += 'Used by: ' + s.depended_by.join(", ");
          html += '</div>';
        }

        // Comparison details
        if (comps.length > 0) {
          for (const comp of comps) {
            const wBadge = comp.winner === "A" ? "With Skill" : comp.winner === "B" ? "Without Skill" : "Tie";
            const wColor = comp.winner === "A" ? "var(--green)" : comp.winner === "B" ? "var(--red)" : "var(--text-muted)";
            html += '<div style="font-size:0.75rem;margin-bottom:0.5rem;"><strong>Comparison:</strong> Winner <span style="color:' + wColor + ';">' + wBadge + '</span>';
            if (comp.rubric && comp.rubric.A) html += ' (A: ' + (comp.rubric.A.overall_score || "?").toFixed(1) + '/10, B: ' + (comp.rubric.B ? comp.rubric.B.overall_score : "?").toFixed(1) + '/10)';
            html += '</div>';
          }
        }

        // Improvement suggestions from analysis
        if (analysis && analysis.improvement_suggestions) {
          html += '<div style="font-size:0.75rem;"><strong>Top Suggestions:</strong><ul style="margin:0.25rem 0 0 1rem;">';
          for (const sug of analysis.improvement_suggestions.slice(0, 3)) {
            const prioColor = sug.priority === "high" ? "var(--red)" : sug.priority === "medium" ? "var(--accent)" : "var(--text-muted)";
            html += '<li><span style="color:' + prioColor + ';">[' + (sug.priority || "?") + ']</span> ' + escapeHtml(sug.suggestion || "").substring(0, 120) + '</li>';
          }
          html += '</ul></div>';
        }

        // Link to full report
        html += '<div style="margin-top:0.5rem;"><a href="javascript:void(0)" onclick="event.stopPropagation()">📄 View full report</a></div>';

        html += '</div>';
      }

      container.innerHTML = html;
    }

    function toggleDrilldown(name) {
      const el = document.getElementById("drilldown-" + name.replace(/'/g, "\\'").replace(/\W/g, "_"));
      if (!el) return;
      el.classList.toggle("open");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
