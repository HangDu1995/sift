<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>audit report</title>
  <style>
    /* :root 变量拷自 viewer.html,保持与路径3 scoring report 同一套配色 */
    :root {
      --bg: #faf9f5;
      --surface: #ffffff;
      --border: #e8e6dc;
      --text: #141413;
      --text-muted: #b0aea5;
      --accent: #d97757;
      --accent-hover: #c4613f;
      --green: #788c5d;
      --green-bg: #eef2e8;
      --red: #c44;
      --red-bg: #fceaea;
      --header-bg: #141413;
      --header-text: #faf9f5;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      margin: 2rem;
    }

    #audit-root {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 960px;
    }

    h1 {
      font-family: 'Poppins', system-ui, sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .transcripts {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      word-break: break-all;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.95rem;
    }
    .summary span { margin-right: 0.8rem; }

    .badge-pass { color: var(--green); font-weight: 600; }
    .badge-fail { color: var(--red); font-weight: 600; }
    .badge-na { color: var(--accent); font-weight: 600; }
    .badge-unresolved { color: var(--text-muted); font-weight: 600; }
    .badge-indeterminate { color: var(--red); font-weight: 600; }
    .badge-tokens { color: var(--text-muted); font-weight: normal; }

    .derived { color: var(--text-muted); font-size: 0.9em; font-weight: normal; }

    .findings, .warnings { margin-top: 1.5rem; }
    .findings h2, .warnings h2 { font-family: 'Poppins', system-ui, sans-serif; font-size: 1.1rem; margin-bottom: 0.5rem; }
    .finding { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; margin-bottom: 0.5rem; }
    .finding-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; font-size: 0.85rem; margin-bottom: 0.25rem; }
    .finding-head .cat, .finding-head .src { color: var(--text-muted); background: var(--bg); padding: 0.05rem 0.4rem; border-radius: 3px; }
    .finding-head .seq { color: var(--text-muted); font-weight: 600; }
    .finding-head .related { font-size: 0.8rem; color: var(--text-muted); }
    /* turn-refs:色由 verdict cls(badge-fail…)给,这里只给字号/字重 */
    .finding-head .turn-refs { font-size: 0.8rem; font-weight: 600; }
    .finding-head .ref-link { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); margin-left: 0.25rem; }
    .finding-head .na-hint { color: var(--text-muted); font-size: 0.85em; font-weight: normal; }
    .finding-head .method { color: var(--text-muted); margin-left: auto; }
    .finding.FAIL { border-left: 3px solid var(--red); }
    .finding.PASS { border-left: 3px solid var(--green); }
    .finding.NA { border-left: 3px solid var(--accent); }
    .finding.UNRESOLVED { border-left: 3px dotted var(--text-muted); }
    .finding.INDETERMINATE { border-left: 3px dashed var(--red); }
    .instruction { font-weight: 600; margin: 0.25rem 0; }
    .evidence { color: var(--text-muted); font-size: 0.9rem; margin: 0.25rem 0; }
    .instruction-anchor { color: var(--text-muted); font-size: 0.8rem; margin: 0.1rem 0 0.25rem; }
    .transcript { color: var(--text-muted); font-size: 0.8rem; }
    .src { color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 0.3rem; margin-left: 0.3rem; font-size: 0.7rem; text-transform: uppercase; }
    .noise { padding: 0.05rem 0.4rem; border-radius: 3px; font-size: 0.72rem; margin-left: 0.3rem; border: 1px solid; display: inline-block; }
    .finding-head .method-prog { color: var(--green); }
    .finding-head .method-llm { color: var(--text-muted); }
    .warnings { background: var(--red-bg); border: 1px solid var(--red); border-radius: var(--radius); padding: 0.75rem 1rem; }
    .warnings ul { margin-top: 0.25rem; padding-left: 1.25rem; }
    .warnings li { color: var(--text); margin: 0.15rem 0; }

    .header { margin-bottom: 0.5rem; }
    .by-instruction { margin-top: 1.5rem; }
    .by-instruction h2 { font-family: 'Poppins', system-ui, sans-serif; font-size: 1.1rem; margin-bottom: 0.5rem; }
    .by-instruction table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    .by-instruction th, .by-instruction td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; }
    .by-instruction th { background: var(--bg); font-weight: 600; }
    .by-instruction td.badge-fail { color: var(--red); font-weight: 600; }
    .by-instruction td.badge-na { color: var(--accent); font-weight: 600; }
    .by-instruction .seq-link { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
    .by-instruction .seq-link:hover { border-bottom-style: solid; }
    .findings-grouped { margin-top: 1.5rem; }
    .findings-grouped h2 { font-family: 'Poppins', system-ui, sans-serif; font-size: 1.1rem; margin-bottom: 0.5rem; }
    .findings-grouped details { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; }
    .findings-grouped summary { font-weight: 600; cursor: pointer; margin-bottom: 0.4rem; }
    .findings-grouped details[open] { border-left: 3px solid var(--accent); }
    .findings-grouped .finding { margin-bottom: 0.4rem; }
  </style>
</head>
<body>
  <div id="audit-root"></div>
  <script>
    /*__EMBEDDED_DATA__*/;
    (function () {
      // escapeHtml:防 evidence/instruction 里的 < > & " ' 破坏页面。放 IIFE 顶部(function 声明会提升,放最顶部最稳)。
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // FAIL 噪声判别徽章(tool_noise 疑似工具噪声 / skill_issue 疑似 skill 问题 / uncertain 待确认)。
      // reasons 进 title hover 显。无 label / 未知 label → 空串。finding-head 与 by_instruction 表共用。
      var NOISE_LABELS = {
        tool_noise: { text: '疑似工具噪声', color: 'var(--text-muted)' },
        skill_issue: { text: '疑似 skill 问题', color: 'var(--red)' },
        uncertain: { text: '待确认', color: 'var(--accent)' }
      };
      function noiseBadge(label, reasons) {
        var nl = NOISE_LABELS[label];
        if (!nl) return '';
        var title = escapeHtml((reasons || []).join('; '));
        return '<span class="noise" style="color:' + nl.color + ';border-color:' + nl.color + ';" title="' + title + '">' + escapeHtml(nl.text) + '</span>';
      }

      // turn_refs:FAIL / INDETERMINATE 违规涉及的 turn(_turn_index,对应 transcript 里的 [Tn] 标记)。
      // 仅 prohibition / step 类填(conditional / output 段级缺席恒空)。序号:cc/structured=会话全局,
      // opencode 切片=段内 local。让 reader 回原 session 定位违规发生处。
      // PASS / N/A / 段级缺席为空 → 返回 ''(无空占位)。
      // 色随 verdict(reuse vd.cls:badge-fail / badge-indeterminate…)。格式 T<n> 绑 [T{idx}] 约定,
      // 不用 #<n>(防与 finding seq #N 混)。finding-head 徽章簇里调,renderFinding 见下。
      function turnBadge(turn_refs, verdict_cls) {
        if (!turn_refs || !turn_refs.length) return '';
        var refs = turn_refs.map(function (t) { return 'T' + t; }).join(', ');
        return '<span class="turn-refs ' + verdict_cls + '" title="违规涉及的 turn(对应 transcript 里的 [Tn] 标记;cc/structured=全局,opencode 切片=段内)">turn: ' + escapeHtml(refs) + '</span>';
      }

      // verdict 五态 → (cls, icon, label) 一致表(汇总徽章 + 明细共用,DRY)。
      // NA 标"不适用"并补"(场景不触发)"hint(单说"不适用"不清晰);UNRESOLVED=没判成(可重跑)、
      // INDETERMINATE=判不准(重跑无益)。旧数据 verdict "UNCLEAR" 由后端 legacy validator 折成 UNRESOLVED。
      var VERDICT_DISPLAY = {
        'PASS':          { cls: 'badge-pass',          icon: '✓', label: '通过' },
        'FAIL':          { cls: 'badge-fail',          icon: '✗', label: '失败' },
        'N/A':           { cls: 'badge-na',            icon: '⊘', label: '不适用' },
        'UNRESOLVED':    { cls: 'badge-unresolved',    icon: '○', label: '没判成' },
        'INDETERMINATE': { cls: 'badge-indeterminate', icon: '?', label: '判不准' },
      };

      // method(判定方法)→ 标签:程序对账 / LLM。与 verdict(结果)正交:回答"怎么查的"。
      // 旧 confidence 假浮点已废;旧数据无 method 字段时显 "—"。
      function methodTag(m) {
        if (m === 'PROGRAMMATIC') return '<span class="method method-prog" title="程序对账(tool_trace 命中 / 子串匹配),不调 LLM">程序</span>';
        if (m === 'LLM') return '<span class="method method-llm" title="LLM 给出结论">LLM</span>';
        return '<span class="method" title="未知判定方法">—</span>';
      }

      // 指令行:优先 source_excerpt(声明原文所属 bullet,含被切的主语);与 instruction_text
      // 不同时把 instruction_text(judge 实际判定的谓语锚点)作小字附下,便于核对。纯显示,
      // 判定只吃 instruction_text 不受影响。
      function renderInstruction(f) {
        var text = f.instruction_text || '';
        var main = f.headline || f.source_excerpt || text;  // headline > excerpt > instruction_text
        if (main.trim() !== text.trim()) {
          return '<div class="instruction">' + escapeHtml(main) + '</div>' +
            '<div class="instruction-anchor">判定锚点:' + escapeHtml(text) + '</div>';
        }
        return '<div class="instruction">' + escapeHtml(text) + '</div>';
      }

      // 单个 finding 的内层 HTML(finding-head + instruction + evidence + transcript)。多/单分支共用,DRY。
      function renderFinding(f) {
        var vd = VERDICT_DISPLAY[f.verdict] || { cls: 'badge-na', icon: '?', label: f.verdict || '?' };
        var verdictHtml = '<span class="' + vd.cls + '" title="' + escapeHtml(f.verdict || '') + '">' + vd.icon + ' ' + escapeHtml(vd.label) + '</span>';
        if (f.verdict === 'N/A') {
          verdictHtml += '<span class="na-hint" title="规则存在但本次 transcript 场景不触发">(场景不触发)</span>';
        }
        var derived = f.derived_from_transcript ? ' <span class="derived">↺ 反推</span>' : '';
        var seqTag = f.seq ? '<span class="seq">#' + escapeHtml(f.seq) + '</span>' : '';
        // 来源徽章:同文去重后多来源用 " + " 连(已排序);单来源原样。sources 空则退回 source。
        var srcs = (f.sources && f.sources.length) ? f.sources : [f.source];
        var srcTag = '<span class="src">' + escapeHtml(srcs.join(' + ')) + '</span>';
        // Case B 同行为跨类关联:↔ 同源违规 #X #Y(可点跳到对应 finding)
        var relLinks = (f.related || []).map(function (r) {
          var n = escapeHtml(String(r).replace('#', ''));
          return '<a class="ref-link" href="#finding-' + n + '">' + escapeHtml(r) + '</a>';
        }).join('');
        var related = relLinks ? '<span class="related">↔ 同源违规</span>' + relLinks : '';
        // FAIL 噪声判别徽章(仅 FAIL 且 noise_label 才显);放 method 前,留在徽章簇里(不跟 method 跑到右侧)
        var noise = (f.verdict === 'FAIL' && f.noise_label) ? noiseBadge(f.noise_label, f.noise_reasons) : '';
        // turn 定位徽章(turn_refs 非空才显,即 FAIL / INDETERMINATE 违规);放噪声后、method 前,留徽章簇里
        var turn = turnBadge(f.turn_refs, vd.cls);
        return '<div class="finding-head">' + verdictHtml +
          seqTag +
          '<span class="cat">' + escapeHtml(f.category || '') + '</span>' +
          srcTag + derived + related + noise + turn +
          methodTag(f.method) + '</div>' +
          renderInstruction(f) +
          '<div class="evidence">' + escapeHtml(f.evidence || '') + '</div>' +
          '<div class="transcript">@ ' + escapeHtml(f.transcript || '') + srcBadge(f.transcript) + '</div>';
      }

      // 包一层带 verdict 边框色的 div;id=finding-<seq> 供 related 锚点跳转
      function findingRow(f) {
        var row = document.createElement('div');
        row.className = 'finding ' + String(f.verdict).replace('/', '');  // "N/A"→"NA" 匹配 CSS .finding.NA(replace 去斜杠,非替下划线)
        if (f.seq) row.id = 'finding-' + f.seq;
        row.innerHTML = renderFinding(f);
        return row;
      }

      var root = document.getElementById('audit-root');
      var findings = EMBEDDED_DATA.findings || [];
      var multi = (EMBEDDED_DATA.transcripts || []).length > 1;

      // transcript 名 → 来源(cc/opencode/...);同序 zip EMBEDDED_DATA.transcripts / transcript_sources。
      // srcBadge 给 transcript 名拼个来源徽章(无来源/旧 report → 空串,不显)。
      var srcOf = {};
      (EMBEDDED_DATA.transcripts || []).forEach(function (n, i) {
        srcOf[n] = (EMBEDDED_DATA.transcript_sources || [])[i] || '';
      });
      function srcBadge(name) {
        var s = srcOf[name];
        return s ? ' <span class="src">' + escapeHtml(s) + '</span>' : '';
      }

      // ① header(skill_name + transcripts + summary 徽章 + derived 计数 + refine 砍除数)
      var derivedCount = findings.filter(function (f) { return f.derived_from_transcript; }).length;
      var refineDropped = EMBEDDED_DATA.refine_dropped_count || 0;
      var s = EMBEDDED_DATA.summary || {};
      var tu = EMBEDDED_DATA.token_usage || {};
      root.insertAdjacentHTML('beforeend',
        '<div class="header">' +
          '<h1>' + escapeHtml(EMBEDDED_DATA.skill_name || '') + '</h1>' +
          '<div class="transcripts">' + (EMBEDDED_DATA.transcripts || []).map(function (n) { return escapeHtml(n) + srcBadge(n); }).join(' · ') + '</div>' +
          '<div class="summary">' +
            '<span class="badge-pass">✓ 通过 ' + (s.pass || 0) + '</span>' +
            '<span class="badge-fail">✗ 失败 ' + (s.fail || 0) + '</span>' +
            '<span class="badge-na">⊘ 不适用 ' + (s.na || 0) + '</span>' +
            ((s.unresolved || 0) ? '<span class="badge-unresolved" title="LLM 调用/解析失败/未提及,可重跑">○ 没判成 ' + s.unresolved + '</span>' : '') +
            ((s.indeterminate || 0) ? '<span class="badge-indeterminate" title="LLM 看了证据但真模糊,重跑无益">? 判不准 ' + s.indeterminate + '</span>' : '') +
            '<span>共 ' + (s.total || 0) + '</span>' +
            (derivedCount ? ' · <span class="derived">↺ ' + derivedCount + ' 条由 transcript 反推</span>' : '') +
            (refineDropped ? ' · <span style="color:var(--accent);" title="LLM 精筛砍掉 extractor 误抽的示例/占位伪指令">↺ refine 砍 ' + refineDropped + ' 条伪指令</span>' : '') +
            (tu.calls ? ' · <span class="badge-tokens" title="本次 audit 所有 LLM 判定调用(refine + 条件/禁令/步骤判官 × 批)的 token 用量合计">⚙ tokens in ' + (tu.input_tokens||0) + ' / out ' + (tu.output_tokens||0) + ' · $' + Number(tu.total_cost_usd||0).toFixed(4) + ' · ' + tu.calls + ' calls</span>' : '') +
            (EMBEDDED_DATA.duration_seconds ? ' · <span class="badge-tokens" title="audit 墙钟(audit 头尾 perf_counter)">⏱ ' + Number(EMBEDDED_DATA.duration_seconds).toFixed(0) + 's</span>' : '') +
          '</div>' +
        '</div>');

      // ② warnings(有才显)
      var warns = EMBEDDED_DATA.warnings || [];
      if (warns.length) {
        root.insertAdjacentHTML('beforeend',
          '<div id="audit-warnings" class="warnings"><h2>⚠️ 警告</h2><ul>' +
          warns.map(function (x) { return '<li>' + escapeHtml(x) + '</li>'; }).join('') +
          '</ul></div>');
      }

      // ③ by_instruction 系统性表(仅多 transcript 且有聚合)。fail 与 N/A 语义不同 → 两张表
      // (同终端):违规表看 fail%/fail/total;场景不适用表看 na/total + 哪几段不适用。
      // 不再混一张让 N/A 行套 fail 列(那看着像有 fail、误导)。全 PASS 仍不列。
      if (multi && (EMBEDDED_DATA.by_instruction || []).length) {
        var byInstr = EMBEDDED_DATA.by_instruction;
        var nTrans = EMBEDDED_DATA.transcripts.length;

        var failRows = byInstr.filter(function (a) { return a.fail_count > 0; });
        if (failRows.length) {
          var failHtml = failRows.map(function (a) {
            var pct = Math.round((a.fail_rate || 0) * 100);
            var colorCls = (a.fail_rate || 0) >= 0.5 ? 'badge-fail' : 'badge-na';
            var seqs = (a.fail_seqs || []).map(function (s) {
              return '<a class="seq-link" href="#finding-' + escapeHtml(s) + '">#' + escapeHtml(s) + '</a>';
            }).join(', ');
            // 噪声判别徽章(fail_count>0 行才有;无 noise_label → —)。整列让 reader 扫哪些 FAIL 是工具噪声。
            var noise = a.noise_label ? noiseBadge(a.noise_label, a.noise_reasons) : '—';
            return '<tr><td class="seq">' + seqs + '</td><td class="' + colorCls + '">' + pct + '%</td>' +
              '<td>' + escapeHtml(a.headline || a.source_excerpt || a.instruction_text || '') + '</td>' +
              '<td>' + escapeHtml(a.category || '') + '</td>' +
              '<td>' + (a.fail_count || 0) + '/' + (a.total || 0) + '</td>' +
              '<td>' + noise + '</td>' +
              '<td>' + escapeHtml((a.fail_in_transcripts || []).join(', ')) + '</td></tr>';
          }).join('');
          root.insertAdjacentHTML('beforeend',
            '<div id="audit-by-instruction-fail" class="by-instruction">' +
              '<h2>违规 FAIL(跨 ' + nTrans + ' transcript)</h2>' +
              '<table><thead><tr><th>明细 #</th><th>fail%</th><th>指令</th><th>类别</th><th>fail/total</th><th>噪声判别</th><th>fail in transcripts</th></tr></thead>' +
              '<tbody>' + failHtml + '</tbody></table>' +
            '</div>');
        }

        var naRows = byInstr.filter(function (a) { return a.na_count > 0; })
          .sort(function (x, y) { return (y.na_count || 0) - (x.na_count || 0); });
        if (naRows.length) {
          var naHtml = naRows.map(function (a) {
            var seqs = (a.na_seqs || []).map(function (s) {
              return '<a class="seq-link" href="#finding-' + escapeHtml(s) + '">#' + escapeHtml(s) + '</a>';
            }).join(', ');
            return '<tr><td class="seq">' + seqs + '</td><td class="badge-na">' + (a.na_count || 0) + '/' + (a.total || 0) + '</td>' +
              '<td>' + escapeHtml(a.headline || a.source_excerpt || a.instruction_text || '') + '</td>' +
              '<td>' + escapeHtml(a.category || '') + '</td>' +
              '<td>' + escapeHtml((a.na_in_transcripts || []).join(', ')) + '</td></tr>';
          }).join('');
          root.insertAdjacentHTML('beforeend',
            '<div id="audit-by-instruction-na" class="by-instruction">' +
              '<h2>场景不适用 N/A(跨 ' + nTrans + ' transcript)</h2>' +
              '<table><thead><tr><th>明细 #</th><th>na/total</th><th>指令</th><th>类别</th><th>na in transcripts</th></tr></thead>' +
              '<tbody>' + naHtml + '</tbody></table>' +
            '</div>');
        }
      }

      // ④ findings:多 transcript → 按指令分组(可折叠);单 transcript → 扁平
      var ORDER = { 'FAIL': 0, 'UNRESOLVED': 1, 'INDETERMINATE': 2, 'N/A': 3, 'PASS': 4 };
      if (multi) {
        root.insertAdjacentHTML('beforeend',
          '<div id="audit-findings-grouped" class="findings-grouped"><h2>明细(按指令分组)</h2></div>');
        var gc = document.getElementById('audit-findings-grouped');
        var grouped = {};
        findings.forEach(function (f) {
          var key = f.instruction_text || '(空)';
          (grouped[key] = grouped[key] || []).push(f);
        });
        Object.keys(grouped).forEach(function (key) {
          var fs = grouped[key];
          var hasFailOrNa = fs.some(function (f) { return f.verdict !== 'PASS'; });
          var details = document.createElement('details');
          if (hasFailOrNa) details.setAttribute('open', '');  // FAIL/NA 组默认展开,全 PASS 折叠
          var sum = document.createElement('summary');
          sum.textContent = key;  // textContent 自动转义,无 XSS
          details.appendChild(sum);
          fs.forEach(function (f) { details.appendChild(findingRow(f)); });
          gc.appendChild(details);
        });
      } else {
        root.insertAdjacentHTML('beforeend',
          '<div id="audit-findings" class="findings"><h2>明细(findings 全集)</h2></div>');
        var fc = document.getElementById('audit-findings');  // M1: getElementById 而非 lastElementChild
        findings.slice().sort(function (a, b) {
          return (ORDER[a.verdict] || 9) - (ORDER[b.verdict] || 9);
        }).forEach(function (f) { fc.appendChild(findingRow(f)); });
      }
    })();
  </script>
</body>
</html>
