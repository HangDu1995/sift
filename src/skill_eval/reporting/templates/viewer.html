          const lsIf = fi.loser || fi.B || {};
          // 败者 score=null(无 skill 基线,without 侧无 compliance)→ 显 N/A,不显假 ?/10
          const scoreText = (v) => (v == null ? "N/A(无 skill 基线)" : v + "/10");
          html += '<div style="display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap;">';
          html += '<div style="flex:1;min-width:150px;"><strong>胜者指令遵循度：</strong> ' + scoreText(wsIf.score) + '</div>';
          html += '<div style="flex:1;min-width:150px;"><strong>败者指令遵循度：</strong> ' + scoreText(lsIf.score) + '</div>';
          html += '</div>';
        }

        if (analysis.winner_strengths && analysis.winner_strengths.length) {
          html += '<div style="margin-bottom:0.75rem;"><strong style="color:var(--green);">胜者优势</strong><ul style="font-size:0.8125rem;margin:0.25rem 0 0 1.25rem;">';
          for (const s of analysis.winner_strengths) html += '<li>' + escapeHtml(s) + '</li>';
          html += '</ul></div>';
        }

        if (analysis.loser_weaknesses && analysis.loser_weaknesses.length) {
          html += '<div style="margin-bottom:0.75rem;"><strong style="color:var(--red);">败者弱点</strong><ul style="font-size:0.8125rem;margin:0.25rem 0 0 1.25rem;">';
          for (const w of analysis.loser_weaknesses) html += '<li>' + escapeHtml(w) + '</li>';
          html += '</ul></div>';
        }

        if (analysis.improvement_suggestions && analysis.improvement_suggestions.length) {
          html += '<strong>改进建议</strong>';
          html += '<table class="benchmark-table" style="margin-top:0.5rem;"><thead><tr><th>优先级</th><th>类别</th><th>建议</th><th>预期影响</th></tr></thead><tbody>';
          for (const s of analysis.improvement_suggestions) {
            const prioColor = s.priority === "high" ? "var(--red)" : s.priority === "medium" ? "var(--accent)" : "var(--text-muted)";
            html += '<tr><td><span style="color:' + prioColor + ';font-weight:600;text-transform:uppercase;font-size:0.7rem;">' + escapeHtml(s.priority) + '</span></td>';
            html += '<td>' + escapeHtml(s.category || "") + '</td>';
            html += '<td style="font-size:0.8125rem;">' + escapeHtml(s.suggestion || "") + '</td>';
            html += '<td style="font-size:0.75rem;color:var(--text-muted);">' + escapeHtml(s.expected_impact || "") + '</td></tr>';
          }
          html += '</tbody></table>';
        }

        if (analysis.transcript_insights && Object.keys(analysis.transcript_insights).length) {
          html += '<div style="margin-top:0.75rem;font-size:0.75rem;color:var(--text-muted);">';
          html += '<strong>transcript 洞察</strong>';
          for (const k in analysis.transcript_insights) {
            html += '<div style="margin-top:0.25rem;"><strong>' + escapeHtml(k) + '</strong>: ' + escapeHtml(analysis.transcript_insights[k]) + '</div>';
          }
          html += '</div>';
        }
        html += '</div>';
      }

      // ── 检查点总览(per-eval 一行,3-dim mean across runs)──
      // 多 eval 的一览索引层:逐项明细前面给一个「哪道题弱、弱在哪维」的扫描表。
      // 点行跳到该 eval 的逐项明细(anchor #eval-{id})。程序/LLM 缺该类 expectation 显 —。
      // 不设派生「状态」列:三率各自按本轴着色,避免用一个混合派生判决误导(混合含 LLM 噪声)。
      // (原区块名实不符:只读首个 checkpoints.json → 只显 eval-1;且逐条 ✓/✗ 明细
      //  已在下方检查项矩阵覆盖全 eval。此处改成聚合总览,不重复明细。)
      const overviewRuns = data.runs || [];
      if (overviewRuns.length > 0) {
        const ovEvalIds = [...new Set(overviewRuns.map(r => r.eval_id))].sort((a, b) => a - b);
        html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-top:1.5rem;">';
        html += '<div class="section-header" style="margin:-1rem -1rem 1rem -1rem;">检查点总览</div>';
        html += '<table class="benchmark-table checkpoint-overview"><thead><tr><th>题号</th><th style="text-align:left;">题名</th><th>程序</th><th>LLM</th><th>混合</th></tr></thead><tbody>';
        for (const evalId of ovEvalIds) {
          const evalRuns = overviewRuns.filter(r => r.eval_id === evalId);
          const evalName = evalRuns[0] && evalRuns[0].eval_name ? evalRuns[0].eval_name : ("Eval " + evalId);
          const mProg = meanField(evalRuns, "pass_rate_programmatic");
          const mLlm = meanField(evalRuns, "pass_rate_llm");
          const mMix = meanField(evalRuns, "pass_rate");
          html += '<tr style="cursor:pointer;" onclick="document.getElementById(\'eval-' + evalId + '\').scrollIntoView({block:\'start\'});">';
          html += '<td>' + evalId + '</td>';
          html += '<td style="text-align:left;">' + escapeHtml(evalName) + '</td>';
          html += '<td class="' + dimCls(mProg) + '">' + fmtDim(mProg) + '</td>';
          html += '<td class="' + dimCls(mLlm) + '">' + fmtDim(mLlm) + '</td>';
          html += '<td class="' + dimCls(mMix) + '">' + fmtDim(mMix) + '</td>';
          html += '</tr>';
        }
        html += '</tbody></table>';
        html += '<div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.5rem;">每 eval 跨所有 run/config 取均值;点行跳到该题逐项明细。程序/LLM 缺该类 expectation 显 —。</div>';
        html += '</div>';
      }

      // ── Per-eval breakdown table ──
      const runs = data.runs || [];
      if (runs.length > 0) {
        const evalIds = [...new Set(runs.map(r => r.eval_id))].sort((a, b) => a - b);
        html += '<div style="margin-top:1.5rem;"><h3 style="font-family:Poppins,sans-serif;margin-bottom:0.75rem;">逐项评测明细</h3>';
        const hasTime = runs.some(r => r.result && r.result.time_seconds != null);

        for (const evalId of evalIds) {
          const evalRuns = runs.filter(r => r.eval_id === evalId);
          const evalName = evalRuns[0] && evalRuns[0].eval_name ? evalRuns[0].eval_name : "Eval " + evalId;
          html += '<h4 id="eval-' + evalId + '" style="font-family:Poppins,sans-serif;margin:1rem 0 0.5rem;">' + escapeHtml(evalName) + '</h4>';
          html += '<table class="benchmark-table"><thead><tr><th>配置</th><th>运行</th><th>程序</th><th>LLM</th><th>混合</th>';
          if (hasTime) html += '<th>耗时 (秒)</th>';
          html += '</tr></thead><tbody>';

          const configGroups = [...new Set(evalRuns.map(r => r.configuration))];
          for (let ci = 0; ci < configGroups.length; ci++) {
            const config = configGroups[ci];
            const configRuns = evalRuns.filter(r => r.configuration === config);
            if (configRuns.length === 0) continue;
            const rowClass = ci === 0 ? "benchmark-row-with" : "benchmark-row-without";
            const configLabel = config.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());

            for (const run of configRuns) {
              const r = run.result || {};
              const prClass = r.pass_rate >= 0.8 ? "benchmark-delta-positive" : r.pass_rate < 0.5 ? "benchmark-delta-negative" : "";
              const anomalyTag = run.is_anomaly ? ' <span style="background:#ffc107;color:#333;padding:0 4px;border-radius:3px;font-size:0.65rem;font-family:Poppins,sans-serif;" title="' + escapeHtml(run.anomaly_reason || '异常值') + '">异常</span>' : "";
              const retryTag = run.retry_count ? ' <span style="background:#e0e0e0;color:#666;padding:0 4px;border-radius:3px;font-size:0.65rem;font-family:Poppins,sans-serif;" title="重试 ' + run.retry_count + ' 次">R' + run.retry_count + '</span>' : "";
              html += '<tr class="' + rowClass + '"><td>' + configLabel + '</td><td>' + run.run_number + anomalyTag + retryTag + '</td>';
              html += '<td class="' + dimCls(r.pass_rate_programmatic) + '">' + fmtDim(r.pass_rate_programmatic) + '</td>';
              html += '<td class="' + dimCls(r.pass_rate_llm) + '">' + fmtDim(r.pass_rate_llm) + '</td>';
              html += '<td class="' + prClass + '">' + ((r.pass_rate || 0) * 100).toFixed(0) + '% (' + (r.passed || 0) + '/' + (r.total || 0) + ')</td>';
              if (hasTime) {
                const timeDisplay = r.time_seconds != null ? r.time_seconds.toFixed(1) : "—";
                const timeStyle = r.time_seconds > 300 ? 'color:var(--red);' : '';
                html += '<td style="' + timeStyle + '">' + timeDisplay + '</td>';
              }
              html += '</tr>';
            }

            const rates = configRuns.map(r => (r.result || {}).pass_rate || 0);
            const avgRate = rates.reduce((a, b) => a + b, 0) / rates.length;
            const avgProg = meanField(configRuns, "pass_rate_programmatic");
            const avgLlm = meanField(configRuns, "pass_rate_llm");
            const avgPrClass = avgRate >= 0.8 ? "benchmark-delta-positive" : avgRate < 0.5 ? "benchmark-delta-negative" : "";
            html += '<tr class="benchmark-row-avg ' + rowClass + '"><td>' + configLabel + '</td><td>平均</td>';
            html += '<td class="' + dimCls(avgProg) + '">' + fmtDim(avgProg) + '</td>';
            html += '<td class="' + dimCls(avgLlm) + '">' + fmtDim(avgLlm) + '</td>';
            html += '<td class="' + avgPrClass + '">' + (avgRate * 100).toFixed(0) + '%</td>';
            if (hasTime) {
              const times = configRuns.map(r => (r.result || {}).time_seconds).filter(t => t != null);
              html += '<td>' + (times.length ? (times.reduce((a, b) => a + b, 0) / times.length).toFixed(1) : "—") + '</td>';
            }
            html += '</tr>';
          }
          html += '</tbody></table>';

          // Per-assertion detail
          const runsWithExpectations = {};
          for (const config of configGroups) {
            runsWithExpectations[config] = evalRuns.filter(r => r.configuration === config && r.expectations && r.expectations.length > 0);
          }
          const hasAnyExp = Object.values(runsWithExpectations).some(runs => runs.length > 0);
          if (hasAnyExp) {
            const allAssertions = [];
            const seen = new Set();
            for (const config of configGroups) {
              for (const run of runsWithExpectations[config]) {
                for (const exp of (run.expectations || [])) {
                  if (!seen.has(exp.text)) { seen.add(exp.text); allAssertions.push(exp.text); }
                }
              }
            }
            html += '<table class="benchmark-table" style="margin-top:0.5rem;"><thead><tr><th>检查项</th>';
            for (const config of configGroups) {
              html += '<th>' + escapeHtml(config.replace(/_/g, " ")) + '</th>';
            }
            html += '</tr></thead><tbody>';
            for (const assertionText of allAssertions) {
              html += '<tr><td>' + escapeHtml(assertionText) + '</td>';
              for (const config of configGroups) {
                html += '<td>';
                for (const run of runsWithExpectations[config]) {
                  const exp = (run.expectations || []).find(e => e.text === assertionText);
                  if (exp) {
                    // verdict 感知图标(与 grading 主列表 + checkpoints 三处统一);紧凑表不加 source 标签
                    let cls, icon, styleAttr = "";
                    if (exp.verdict === "UNEVAL") {
                      cls = ""; icon = "?"; styleAttr = ' style="color:var(--accent);font-weight:600;" title="无法评估"';
                    } else if (exp.verdict === "TIMEOUT") {
                      cls = ""; icon = "⏱"; styleAttr = ' style="color:var(--accent);font-weight:600;" title="超时"';
                    } else if (exp.verdict === "ERROR") {
                      cls = ""; icon = "!"; styleAttr = ' style="color:var(--red);font-weight:600;" title="错误"';
                    } else {
                      cls = exp.passed ? "benchmark-delta-positive" : "benchmark-delta-negative";
                      icon = exp.passed ? "✓" : "✗";
                    }
                    html += '<span class="' + cls + '"' + styleAttr + '>' + icon + '</span> ';
                  } else {
                    html += '— ';
                  }
                }
                html += '</td>';
              }
              html += '</tr>';
            }
            html += '</tbody></table>';
          }
        }
        html += '</div>';
      }

      // ── Analysis notes (string notes) ──
      const stringNotes = notes.filter(n => typeof n === 'string');
      if (stringNotes.length > 0) {
        html += '<div class="benchmark-notes" style="margin-top:1.5rem;">';
        html += '<h3>分析备注（' + stringNotes.length + '）</h3><ul>';
        for (const note of stringNotes) html += '<li>' + escapeHtml(note) + '</li>';
        html += '</ul></div>';
      }

      container.innerHTML = html;

      // ── Chart.js pass rate bar chart(grouped bar:混合 + 客观 + 主观,与表格双率行对齐)──
      if (configA && configB) {
        setTimeout(() => {
          const canvas = document.getElementById("passRateChart");
          if (!canvas) return;
          const labels = [configA.replace(/_/g, " "), configB.replace(/_/g, " ")];
          // 每 config 三率(混合/客观/主观);某 config 无该类 expectation → null(该柱不画)
          const mix = [a.pass_rate, b.pass_rate].map(s => s ? s.mean * 100 : null);
          const prog = [a.pass_rate_programmatic, b.pass_rate_programmatic].map(s => s ? s.mean * 100 : null);
          const llm = [a.pass_rate_llm, b.pass_rate_llm].map(s => s ? s.mean * 100 : null);
          const datasets = [];
          if (mix.some(v => v != null))  datasets.push({ label: "混合",         data: mix,  backgroundColor: "#8a8a8a", borderRadius: 4 });
          if (prog.some(v => v != null)) datasets.push({ label: "程序化(客观)", data: prog, backgroundColor: "#788c5d", borderRadius: 4 });
          if (llm.some(v => v != null))  datasets.push({ label: "LLM(主观)",    data: llm,  backgroundColor: "#c89b5a", borderRadius: 4 });
          new Chart(canvas, {
            type: "bar",
            data: { labels: labels, datasets: datasets },
            options: {
              responsive: true,
              plugins: { legend: { display: true } },
              scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + "%" } } }
            }
          });
        }, 100);
      }
    }

    // ---- Start ----
    init();
    renderBenchmark();
  </script>
</body>
</html>
