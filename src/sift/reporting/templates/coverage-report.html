<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coverage report</title>
  <style>
    /* :root 变量拷自 trigger-report.html / audit-report.html,保持同一套配色 */
    :root {
      --bg: #faf9f5;
      --surface: #ffffff;
      --border: #e8e6dc;
      --text: #141413;
      --text-muted: #b0aea5;
      --accent: #d97757;
      --accent-hover: #c4613f;
      --green: #788c5d;
      --green-bg: #eef2e8;
      --red: #c44;
      --red-bg: #fceaea;
      --header-bg: #141413;
      --header-text: #faf9f5;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      margin: 2rem;
    }

    #coverage-root {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 960px;
    }

    h1 { font-family: 'Poppins', system-ui, sans-serif; font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }

    .summary { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .summary span { margin-right: 0.8rem; }
    .badge-fail { color: var(--red); font-weight: 600; }
    .badge-tokens { color: var(--text-muted); font-weight: normal; }

    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
    th { background: var(--bg); font-weight: 600; }
    td.quote { color: var(--text-muted); font-size: 0.85rem; white-space: pre-wrap; max-width: 360px; }
    tr.gap { background: var(--red-bg); }
  </style>
</head>
<body>
  <div id="coverage-root"></div>
  <script>
    /*__EMBEDDED_DATA__*/;
    (function () {
      function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
      function fmtDur(sec){if(!sec)return '';return sec>=60?(sec/60).toFixed(1)+'min':sec.toFixed(1)+'s';}
      var D = EMBEDDED_DATA;
      var gaps = (D.points||[]).filter(function(p){return !p.covered_by || !p.covered_by.length;});
      var tu = D.token_usage || {};
      var tok = (tu.input_tokens||0) + (tu.output_tokens||0);
      var html = '';
      html += '<h1>' + escapeHtml(D.skill_name) + ' · coverage 报告</h1>';
      html += '<div class="summary">';
      html += '<span>内容点 <b>' + (D.points||[]).length + '</b></span>';
      html += '<span>漏测 <b class="badge-fail">' + gaps.length + '</b></span>';
      if (tok) html += '<span class="badge-tokens">' + tok + ' tok</span>';
      var d = fmtDur(D.duration_seconds); if (d) html += '<span class="badge-tokens">耗时 ' + d + '</span>';
      html += '</div>';
      html += '<table><tr><th>内容点</th><th>SKILL.md 原文</th><th>覆盖 eval</th></tr>';
      (D.points||[]).forEach(function(p){
        var gap = !p.covered_by || !p.covered_by.length;
        html += '<tr class="' + (gap?'gap':'') + '">'
             + '<td>' + escapeHtml(p.label) + '</td>'
             + '<td class="quote">' + escapeHtml(p.source_quote||'') + '</td>'
             + '<td>' + (gap?'<span class="badge-fail">漏测</span>':(p.covered_by||[]).join(', ')) + '</td>'
             + '</tr>';
      });
      html += '</table>';
      document.getElementById('coverage-root').innerHTML = html;
    })();
  </script>
</body>
</html>
