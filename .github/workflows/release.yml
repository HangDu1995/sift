name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: skill-eval-linux
          - os: macos-latest
            binary: skill-eval-macos
          - os: windows-latest
            binary: skill-eval-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller .

      - name: Build binary
        run: pyinstaller --onefile --name skill-eval --paths src run.py

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/skill-eval.exe dist/${{ matrix.binary }}
          else
            mv dist/skill-eval dist/${{ matrix.binary }}
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.binary }}
          tag_name: ${{ github.ref_name }}
