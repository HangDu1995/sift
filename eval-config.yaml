version: 1
scanning:
  collection_prefix: "arkts"

domain_templates:
  data:
    assertions:
      - type: CONTAINS_PATTERN
        pattern: "IDataSource|LazyDataSource|BasicDataSource"
        description: "Data source implementation present"
      - type: CONTAINS_PATTERN
        pattern: "http\\.createHttp|@ohos\\.net\\.http"
        description: "Network request layer implemented"
      - type: CONTAINS_PATTERN
        pattern: "preferences|PersistentStorage|dataPreferences"
        description: "Data persistence mechanism used"
      - type: CONTAINS_PATTERN
        pattern: "async|await|Promise"
        description: "Async data handling patterns present"
  engineering:
    assertions:
      - type: CONTAINS_PATTERN
        pattern: "module\\.json5|oh-package\\.json5"
        description: "HarmonyOS project configuration exists"
      - type: CONTAINS_PATTERN
        pattern: "i18n|\\$r\\(|getStringSync"
        description: "Internationalization support implemented"
      - type: FILE_EXISTS
        params:
          filename: "build-profile.json5"
        description: "Build profile configuration present"
      - type: CONTAINS_PATTERN
        pattern: "hvigorw|hvigor"
        description: "Build toolchain configured"
  general:
    assertions:
      - type: CODE_COMPILES
        params:
          include: "**/*.ets"
        description: "All ArkTS files pass syntax check"
      - type: CROSS_FILE_CONSISTENCY
        params:
          include: "**/*.ets"
        description: "Import references resolve correctly"
      - type: CONTAINS_PATTERN
        pattern: "@Entry|@Component"
        description: "ArkTS component decorators present"
      - type: CONTAINS_PATTERN
        pattern: "struct\\s+\\w+"
        description: "Component struct declarations exist"
  media:
    assertions:
      - type: CONTAINS_PATTERN
        pattern: "AVPlayer|media\\.createAVPlayer"
        description: "Media player implementation present"
      - type: CONTAINS_PATTERN
        pattern: "request\\.agent|downloadTask"
        description: "Download manager implementation present"
      - type: CONTAINS_PATTERN
        pattern: "AVSession|ContinuousTask"
        description: "Background playback support configured"
  migration:
    assertions:
      - type: FILE_EXISTS
        params:
          filename: "ui-manifest.md"
        description: "UI manifest spec generated"
      - type: FILE_EXISTS
        params:
          filename: "feature-index.md"
        description: "Feature index spec generated"
      - type: CONTAINS_PATTERN
        pattern: "confidence.*(high|medium|low)"
        description: "Confidence ratings assigned to migration items"
      - type: CONTAINS_PATTERN
        pattern: "page_\\d{4}\\.md"
        description: "Page spec files follow naming convention"
      - type: llm_judge
        params:
          criteria: "Migration plan covers all source activities and maps them to target pages"
        description: "Migration completeness check"
  navigation:
    assertions:
      - type: CONTAINS_PATTERN
        pattern: "Navigation|NavPathStack|NavDestination"
        description: "Navigation container and routing configured"
      - type: CONTAINS_PATTERN
        pattern: "pushPathByName|pushPath|pop"
        description: "Navigation stack operations implemented"
      - type: CONTAINS_PATTERN
        pattern: "Tabs|TabContent|TabBar"
        description: "Tab navigation structure present"
  state:
    assertions:
      - type: CONTAINS_PATTERN
        pattern: "@State|@Prop|@Link|@Provide|@Consume"
        description: "State management decorators used"
      - type: CONTAINS_PATTERN
        pattern: "@Observed|@ObjectLink"
        description: "Observable object patterns implemented"
      - type: CONTAINS_PATTERN
        pattern: "AppStorage|LocalStorage|PersistentStorage"
        description: "Global state storage configured"
      - type: NOT_CONTAINS
        pattern: "@State\\s+\\w+:\\s+any"
        description: "No untyped state declarations"
  system:
    assertions:
      - type: CONTAINS_PATTERN
        pattern: "abilityAccessCtrl|requestPermissionsFromUser"
        description: "Permission request flow implemented"
      - type: CONTAINS_PATTERN
        pattern: "fileIo|fs\\."
        description: "File system operations present"
      - type: CONTAINS_PATTERN
        pattern: "bundleName|versionName|versionCode"
        description: "App identity configuration present"
      - type: CONTAINS_PATTERN
        pattern: "WebviewController|Web\\("
        description: "WebView integration present"
  ui:
    assertions:
      - type: CONTAINS_PATTERN
        pattern: "Column|Row|Stack|Flex|Grid|List"
        description: "Layout containers used"
      - type: CONTAINS_PATTERN
        pattern: "animateTo|animation\\(|transition\\("
        description: "Animation implementations present"
      - type: CONTAINS_PATTERN
        pattern: "\\$r\\(|\\$rawfile\\("
        description: "Resource references use proper API"
      - type: NOT_CONTAINS
        pattern: "hardcoded.*#[0-9a-fA-F]{6}"
        description: "No hardcoded color values in UI code"
      - type: CONTAINS_PATTERN
        pattern: "breakpoint|sm|md|lg"
        description: "Responsive breakpoint adaptation present"
      - type: CONTAINS_PATTERN
        pattern: "accessibilityText|accessibilityDescription"
        description: "Accessibility labels present"

type_templates:
  codebase:
    assertions:
      - type: CODE_COMPILES
        params:
          include: "**/*.ets"
        description: "Codebase compiles without syntax errors"
      - type: CROSS_FILE_CONSISTENCY
        params:
          include: "**/*.ets"
        description: "All imports resolve to existing modules"
      - type: CONTAINS_PATTERN
        pattern: "export\\s+(default\\s+)?(struct|class|function|const)"
        description: "Modules export their public API"
  domain:
    assertions:
      - type: llm_judge
        params:
          criteria: "Generated code follows HarmonyOS ArkTS idioms and best practices"
        description: "Domain-specific code quality check"
      - type: CONTAINS_PATTERN
        pattern: "@ohos\\.|@kit\\."
        description: "Uses official HarmonyOS SDK imports"
      - type: CODE_COMPILES
        params:
          include: "**/*.ets"
        description: "Domain code compiles cleanly"
  pipeline:
    assertions:
      - type: FILE_EXISTS
        params:
          filename: "ui-plan.md"
        description: "Pipeline produces planning artifacts"
      - type: FILE_EXISTS
        params:
          filename: "feature-plan.md"
        description: "Pipeline produces feature plan"
      - type: llm_judge
        params:
          criteria: "Pipeline steps execute in correct dependency order and produce expected artifacts"
        description: "Pipeline execution order and completeness"
      - type: CONTAINS_PATTERN
        pattern: "PASSED|FAILED|SKIPPED"
        description: "Pipeline reports step status"
  tool:
    assertions:
      - type: CUSTOM_SCRIPT
        params:
          script: "check_tool_output.py"
          args: "--format json"
        description: "Tool produces structured output"
      - type: llm_judge
        params:
          criteria: "Tool output is actionable and provides clear next steps"
        description: "Tool output quality check"
      - type: CONTAINS_PATTERN
        pattern: "\\[OK\\]|\\[WARN\\]|\\[ERROR\\]"
        description: "Tool provides status indicators"

integration_scenarios:
  - name: "full-migration-chain"
    type: chain
    chain:
      - "a2h-spec"
      - "a2h-plan"
      - "a2h-execute"
      - "a2h-verify"
      - "a2h-retrospect"
    input:
      project_path: "fixtures/projects/android-sample"
      target: "harmonyos"

  - name: "skill-routing-by-keyword"
    type: routing
    test_prompts:
      - prompt: "分析这个Android项目的页面结构"
        should_trigger: ["a2h-spec"]
        should_not_trigger: ["a2h-execute"]
      - prompt: "生成一个列表组件"
        should_trigger: ["arkts-component-builder"]
        should_not_trigger: ["arkts-data-layer"]
      - prompt: "这个API在鸿蒙上有吗"
        should_trigger: ["arkts-library-migration"]
        should_not_trigger: ["arkts-animation-builder"]
      - prompt: "编译失败了帮我看看"
        should_trigger: ["hmos-fix-build-errors"]
        should_not_trigger: ["arkts-pattern-library"]
      - prompt: "文字被截断了"
        should_trigger: ["arkts-text-truncation"]
        should_not_trigger: ["arkts-dark-mode"]

  - name: "spec-to-plan-contract"
    type: contract
    producer: "a2h-spec"
    consumer: "a2h-plan"
    artifact: "spec/baseline/ui-manifest.md"
    checks:
      - "artifact contains page entries with confidence ratings"
      - "artifact follows markdown structure with headers per page"
      - "consumer can parse all page references from artifact"

  - name: "graph-to-relationship-tree-contract"
    type: contract
    producer: "android-ui-graph-builder"
    consumer: "app-relationship-tree"
    artifact: "ui-graph/screens.json"
    checks:
      - "artifact contains Screen and Component nodes"
      - "artifact includes Navigation edges"
      - "consumer merges graph data into unified tree"

skill_keywords:
  a2h-execute: ["执行", "execute", "pipeline", "stage", "转换", "migration-run", "重试", "compile"]
  a2h-plan: ["计划", "plan", "ui-plan", "feature-plan", "拓扑排序", "批次", "优先级"]
  a2h-retrospect: ["回顾", "retrospect", "经验", "优化", "差异分析", "沉淀", "pipeline对比"]
  a2h-spec: ["spec", "分析", "迁移", "ui-manifest", "feature-index", "confidence", "数据准备"]
  a2h-verify: ["验证", "verify", "编译检查", "静态分析", "审计", "confidence降级", "验收"]
  android-api-inventory: ["API清单", "接口", "REST", "WebSocket", "SDK", "梳理", "覆盖度"]
  android-screenshot-analyzer: ["截图", "screenshot", "页面分析", "界面布局", "命名", "批量"]
  android-ui-graph-builder: ["graph", "知识图谱", "XML", "layout", "manifest", "navigation", "UI结构"]
  android-ui-graph-query: ["query", "查询", "context", "screen-level", "component-level", "迁移上下文"]
  android-view-to-arkui: ["View", "XML", "ArkUI", "Activity", "Fragment", "batch", "audit"]
  android2hmos_resources_convert: ["resources", "strings", "colors", "dimensions", "images", "drawable", "convert"]
  app-relationship-tree: ["关系树", "relationship-tree", "页面关系", "聚合", "融合", "Screen", "Component"]
  arkts-accessibility: ["无障碍", "accessibility", "焦点", "tabIndex", "屏幕朗读", "热区", "对比度"]
  arkts-animation-builder: ["动画", "animation", "animateTo", "transition", "Spring", "手势跟随", "转场"]
  arkts-app-identity: ["bundleName", "app名称", "图标", "版本号", "app.json5", "身份信息"]
  arkts-codebase-config: ["配置", "config", "权限", "flag", "module.json5", "开关", "FeatureFlag"]
  arkts-codebase-debug: ["debug", "不生效", "报错", "缺陷", "诊断", "修复", "异常"]
  arkts-codebase-explainer: ["解释", "explain", "实现原理", "执行流程", "怎么实现", "为什么"]
  arkts-codebase-locator: ["定位", "locate", "在哪", "功能位置", "入口", "导航"]
  arkts-codebase-modifier: ["修改", "modify", "新增", "增加", "扩展", "调整"]
  arkts-component-builder: ["组件", "component", "Column", "Row", "Grid", "List", "布局", "@Builder"]
  arkts-dark-mode: ["深色模式", "dark-mode", "主题", "ColorMode", "dark", "颜色切换"]
  arkts-data-layer: ["数据层", "data", "网络请求", "HTTP", "Preferences", "持久化", "JSON"]
  arkts-download-manager: ["下载", "download", "request.agent", "进度", "队列", "大文件"]
  arkts-i18n: ["国际化", "i18n", "多语言", "语言切换", "资源文件", "本地化"]
  arkts-knowledge-verifier: ["验证知识", "knowledge", "API兼容", "是否存在", "语法规则", "正确性"]
  arkts-large-font: ["大字体", "fontSizeScale", "字体缩放", "适老化", "截断", "溢出"]
  arkts-library-migration: ["三方库", "library", "ohpm", "替代", "依赖", "Glide", "npm"]
  arkts-media-playback: ["播放", "AVPlayer", "音视频", "后台播放", "AVSession", "队列"]
  arkts-multi-device: ["多设备", "breakpoint", "折叠屏", "平板", "响应式", "RTL", "适配"]
  arkts-multi-window: ["多窗口", "分屏", "悬浮窗", "画中画", "FLOATING", "窗口形态"]
  arkts-navigation-builder: ["导航", "navigation", "NavPathStack", "路由", "跳转", "Tab", "页面切换"]
  arkts-pattern-library: ["模式库", "pattern", "搜索功能", "列表详情", "登录", "下拉刷新", "业务功能"]
  arkts-project-scaffolder: ["项目结构", "scaffold", "module.json5", "多模块", "EntryAbility", "配置"]
  arkts-spec-evolver: ["spec演进", "evolver", "补全", "Bug修复", "审计", "增量", "spec先行"]
  arkts-state-manager: ["状态管理", "@State", "@Link", "AppStorage", "数据通信", "@Observed", "刷新"]
  arkts-system-capabilities: ["系统API", "权限", "fileIo", "photoAccessHelper", "后台任务", "沙箱"]
  arkts-text-truncation: ["文本截断", "Ellipsis", "溢出", "maxLines", "省略号", "裁切"]
  arkts-truncation-fix: ["截断修复", "布局溢出", "安全区", "显示不全", "适配", "响应式"]
  arkts-ui-alignment: ["UI对齐", "Material Design", "等价", "SymbolGlyph", "视觉匹配"]
  arkts-visual-verify: ["截图对比", "visual", "视觉验证", "UI一致性", "自动截图", "多模态"]
  arkts-webview-manager: ["WebView", "WebviewController", "JS注入", "CSS注入", "标签页", "浏览器"]
  drawio: ["diagram", "flowchart", "架构图", "ER图", "序列图", "wireframe", "mockup"]
  fix-issue: ["fix", "issue", "GitHub", "修复", "bug", "#"]
  hmos-env-doctor: ["环境", "doctor", "编译失败", "签名", "hvigorw", "诊断", "环境检测"]
  hmos-fix-build-errors: ["build", "编译错误", "fix", "自动修复", "HAP", "循环修复"]
  skill-checker: ["检查", "checker", "规范", "合规", "validation", "governance"]

pipelines:
  - name: "android-to-harmonyos-full-migration"
    description: "End-to-end Android to HarmonyOS migration pipeline covering spec, plan, execute, verify, and retrospect"
    project: "fixtures/projects/example"
    steps:
      - name: "api-inventory"
        skill: "android-api-inventory"
        prompt: "梳理这个Android项目用了哪些外部API和接口"
        expectations:
          - "Generates structured API inventory document"
          - "Covers REST, WebSocket, and SDK dependencies"
        assertions:
          - name: "inventory-file-created"
            type: FILE_EXISTS
            params:
              filename: "api-inventory.md"
          - name: "contains-api-entries"
            type: CONTAINS_PATTERN
            params:
              pattern: "(GET|POST|PUT|DELETE|WebSocket)"
              path: "api-inventory.md"
        depends_on: []

      - name: "ui-graph-build"
        skill: "android-ui-graph-builder"
        prompt: "构建这个Android项目的UI结构图谱"
        expectations:
          - "Produces JSON graph with Screen and Component nodes"
        assertions:
          - name: "graph-output-exists"
            type: FILE_EXISTS
            params:
              filename: "ui-graph/screens.json"
          - name: "graph-has-nodes"
            type: JSON_HAS_FIELD
            params:
              filename: "ui-graph/screens.json"
              field: "nodes"
        depends_on: []

      - name: "screenshot-analysis"
        skill: "android-screenshot-analyzer"
        prompt: "分析screenshots目录下的所有页面截图并生成分析报告"
        expectations:
          - "Generates markdown report for each screenshot"
        assertions:
          - name: "report-generated"
            type: FILE_EXISTS
            params:
              filename: "screenshot-analysis.md"
        depends_on: []
